<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>안개 낀 아침 숲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
<style>
  /* Layout: the forest fills the screen; a quiet caption sits at the top, the walking stick bottom-left on touch screens. */
  :root {
    color-scheme: dark;
    --bg: #101812;                       /* canopy shade, shown while loading */
    --fg: #f1f4e8;                       /* morning light */
    --muted: #c6d1ba;                    /* lichen */
    --scrim: rgba(10, 18, 12, .6);
    --pad: rgba(241, 244, 232, .12);     /* walking stick base */
    --knob: rgba(241, 244, 232, .55);
    --display: "Gowun Batang", "Noto Serif KR", "Apple SD Gothic Neo", serif;
    --body: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
  #view { position: relative; height: 100%; user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; }
  #caption {
    position: absolute; inset: 0 0 auto; pointer-events: none;
    padding-block: 14px 44px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(var(--scrim), transparent);
  }
  h1 { margin: 0 0 4px; font: 700 1.5rem/1.2 var(--display); text-wrap: balance; }
  p { margin: 0; color: var(--muted); font-size: .85rem; line-height: 1.5; }
  #stick {
    position: absolute; left: max(22px, env(safe-area-inset-left, 0px)); bottom: 30px;
    width: 124px; aspect-ratio: 1; border-radius: 50%; touch-action: none;
    background: var(--pad); border: 1.5px solid var(--knob);
  }
  #stick i { position: absolute; inset: 31%; border-radius: 50%; background: var(--knob); }
  .touch, #stick { display: none; }
  @media (pointer: coarse) { .keys { display: none; } .touch, #stick { display: block; } }
</style>

<div id="view">
  <div id="caption">
    <h1>안개 낀 아침 숲</h1>
    <p id="stand">숲을 불러오는 중…</p>
    <p class="keys">W A S D: 걷기 · Shift: 달리기 · 드래그: 둘러보기</p>
    <p class="touch">왼쪽 스틱: 걷기 · 화면 드래그: 둘러보기</p>
  </div>
  <div id="stick"><i></i></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';
// Procedural trees with photo bark/leaf textures baked into the script (no image requests).
import { Tree, TreePreset } from 'https://cdn.jsdelivr.net/npm/@dgreenheck/ez-tree@1.1.0/build/ez-tree.es.js';

const view = document.getElementById('view');
const lite = matchMedia('(pointer: coarse)').matches;            // phones: smaller, lighter forest
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const R = lite ? 115 : 150;                                      // forest radius in metres
const ROAM = R - 75;                                             // walkable radius; the forest beyond dissolves into mist
const TILE = lite ? 56 : 70;                                     // side of the square of grass and ferns kept around the walker
const CELL = 40, EYE = 1.65;
THREE.MathUtils.seededRandom(11);                                // same forest every visit
const rnd = (lo = 0, hi = 1) => lo + (hi - lo) * THREE.MathUtils.seededRandom();
const perlin = new ImprovedNoise();
const height = (x, z) =>
  5 * perlin.noise(x * .012, 0, z * .012) + 1.2 * perlin.noise(x * .05, 7, z * .05) + .25 * perlin.noise(x * .11, 3, z * .11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, lite ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .7;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                           // nothing that casts a shadow moves
renderer.shadowMap.needsUpdate = true;
// Leaf shadows are cut out by the leaf textures, which finish decoding after startup.
THREE.DefaultLoadingManager.onLoad = () => { renderer.shadowMap.needsUpdate = true; };
view.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb9cbc4, .02);
const camera = new THREE.PerspectiveCamera(60, 1, .15, 6000);

// Low morning sun
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(52), THREE.MathUtils.degToRad(140));
const SUN = `(mat3(viewMatrix) * vec3(${sunDir.toArray().map(v => v.toFixed(4))}))`;   // sun direction in view space, for shaders
const sky = new Sky();
sky.scale.setScalar(5000);
const su = sky.material.uniforms;
su.turbidity.value = 8; su.rayleigh.value = 1.4; su.mieCoefficient.value = .008; su.mieDirectionalG.value = .86;
su.sunPosition.value.copy(sunDir);
scene.add(sky, new THREE.HemisphereLight(0xcfe0f5, 0x6f7446, 2.6));

const sun = new THREE.DirectionalLight(0xffe7c4, 4.5);
sun.position.copy(sunDir).multiplyScalar(400);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(lite ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -R, right: R, top: R, bottom: -R, near: 1, far: 900 });
sun.shadow.bias = -.0005;
sun.shadow.normalBias = .05;
scene.add(sun);

// Mist glows warm when you look toward the sun, in every material that takes fog.
{
  const C = THREE.ShaderChunk, both = s => s.replace('varying float vFogDepth;', 'varying float vFogDepth; varying vec3 vFogPos;');
  C.fog_pars_vertex = both(C.fog_pars_vertex);
  C.fog_pars_fragment = both(C.fog_pars_fragment);
  C.fog_vertex = C.fog_vertex.replace('vFogDepth = - mvPosition.z;', 'vFogDepth = - mvPosition.z; vFogPos = mvPosition.xyz;');
  C.fog_fragment = C.fog_fragment.replace('fogColor, fogFactor',
    `min(fogColor + vec3(.34, .24, .1) * pow(max(dot(normalize(vFogPos), ${SUN}), 0.), 5.), 1.), fogFactor`);
}

// Forest floor: leaf litter drawn once on a canvas, tiled, tinted by large moss/dirt patches
function litter() {
  const S = 1024, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#544733';
  g.fillRect(0, 0, S, S);
  const pal = ['#6a573a', '#7a6646', '#55452c', '#8a7446', '#4a5230', '#5c683a', '#3d3120', '#958058'];
  for (let i = 0; i < 26000; i++) {
    const twig = i % 40 === 0, w = twig ? rnd(15, 40) : rnd(1.5, 7), h = twig ? 1 : w * rnd(.25, .5);
    const x = rnd(40, S + 40), y = rnd(40, S + 40), a = rnd(0, 3.14);
    g.fillStyle = pal[(rnd() * pal.length) | 0];
    g.globalAlpha = rnd(.3, .7);
    for (const [ox, oy] of [[0, 0], [S, 0], [0, S], [S, S]]) {   // repeat across the edges so the tile is seamless
      g.beginPath(); g.ellipse(x - ox, y - oy, w, h, a, 0, 7); g.fill();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.setScalar(80);
  t.anisotropy = 8;
  return t;
}
let hmap;                                                        // terrain heights as a texture, so ground cover can sit on it in the shader
{
  const g = new THREE.PlaneGeometry(500, 500, 250, 250).rotateX(-Math.PI / 2);
  const p = g.attributes.position, col = [], hs = new Uint16Array(p.count);
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), y = height(x, z);
    const moss = THREE.MathUtils.smoothstep(perlin.noise(x * .04, 20, z * .04) + .5 * perlin.noise(x * .15, 30, z * .15), -.4, .5);
    p.setY(i, y);
    hs[i] = THREE.DataUtils.toHalfFloat(y);
    col.push(1 - .4 * moss, .92 + .05 * moss, .8 - .4 * moss);
  }
  hmap = new THREE.DataTexture(hs, 251, 251, THREE.RedFormat, THREE.HalfFloatType);
  hmap.magFilter = hmap.minFilter = THREE.LinearFilter;
  hmap.needsUpdate = true;
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const map = litter(), bumpMap = map.clone();
  map.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.MeshStandardMaterial({ map, bumpMap, bumpScale: 1.5, roughness: 1, vertexColors: true });
  mat.onBeforeCompile = s => {                                   // past the last blades the floor takes the colour of grass
    s.fragmentShader = s.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(.1, .16, .04), .8 * smoothstep(${TILE / 2 - 16}., ${TILE / 2 - 3}., length(vViewPosition)));`);
  };
  const ground = new THREE.Mesh(g, mat);
  ground.receiveShadow = true;
  scene.add(ground);
}

// Trees and undergrowth
const time = { value: 0 };
const noFlip = s => {                                            // foliage is lit as a volume, so back faces keep their normal
  s.fragmentShader = s.fragmentShader.replace('#include <normal_fragment_begin>', '#include <normal_fragment_begin>\nnormal = normalize(vNormal);');
};
function crown(leaves) {
  // Shade the crown as one soft volume instead of thousands of flat cards.
  const g = leaves.geometry, p = g.attributes.position, n = g.attributes.normal, v = new THREE.Vector3();
  g.computeBoundingBox();
  const c = g.boundingBox.getCenter(new THREE.Vector3());
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).sub(c).normalize();
    v.y += .5;
    v.normalize();
    n.setXYZ(i, v.x, v.y, v.z);
  }
  // ez-tree's wind shader predates instancing: add the instance transform and share one clock.
  const lib = leaves.material.onBeforeCompile;
  leaves.material.onBeforeCompile = (s, r) => {
    lib(s, r);
    s.uniforms.uTime = time;
    s.vertexShader = s.vertexShader.replace('mvPosition = modelViewMatrix * mvPosition;', 'mvPosition = modelViewMatrix * instanceMatrix * mvPosition;');
    noFlip(s);
    // Leaves let sunlight through: they glow when seen against the sun.
    s.fragmentShader = s.fragmentShader.replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
      reflectedLight.indirectDiffuse += diffuseColor.rgb * vec3(1., .9, .55) * pow(max(dot(-normalize(vViewPosition), ${SUN}), 0.), 3.);`);
  };
}
// Plants are grouped per CELL so those off screen or lost in the mist are not drawn.
const cells = new Map(), solid = [];
function cellAt(x, z) {
  const i = Math.floor(x / CELL), j = Math.floor(z / CELL), key = i + ',' + j;
  if (!cells.has(key)) {
    const g = new THREE.Group();
    g.userData.mid = new THREE.Vector3((i + .5) * CELL, 0, (j + .5) * CELL);
    cells.set(key, g);
    scene.add(g);
  }
  return cells.get(key);
}
const dummy = new THREE.Object3D(), tint = new THREE.Color();
// A preset listed twice is twice as common and gets two differently shaped individuals.
function scatter(presets, count, spacing, inner, blocks) {
  const kinds = presets.map((name, i) => {
    const t = new Tree(), o = t.options, b = o.branch;
    o.copy(structuredClone(TreePreset[name]));
    o.seed = 100 + i * 37;
    // The presets are modelled as one hero tree; a whole forest needs each tree several times lighter.
    for (const l of [1, 2, 3]) {
      b.sections[l] = Math.min(b.sections[l], [0, 4, 2, 1][l]);
      b.segments[l] = l > 1 || o.type === 'evergreen' ? 3 : 5;      // a conifer's first branches are already twigs
    }
    o.leaves.count = Math.ceil(o.leaves.count * .5);
    o.leaves.size *= 1.3;
    if (lite) o.leaves.billboard = 'single';
    t.generate();
    crown(t.leavesMesh);
    return { t, scale: name.startsWith('Pine') ? .36 : .3, at: new Map() };
  });
  const spots = [];
  for (let tries = 0; spots.length < count && tries < count * 30; tries++) {
    const r = R * Math.sqrt(rnd()), a = rnd(0, 6.283), x = r * Math.cos(a), z = r * Math.sin(a);
    if (r < inner || spots.some(s => (s.x - x) ** 2 + (s.z - z) ** 2 < spacing * spacing)) continue;
    spots.push({ x, z });
    const k = kinds[(rnd() * kinds.length) | 0], s = k.scale * rnd(.75, 1.3), g = cellAt(x, z);
    dummy.position.set(x, height(x, z) - .15, z);
    dummy.rotation.set(rnd(-.04, .04), rnd(0, 6.283), rnd(-.04, .04));
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    (k.at.get(g) ?? k.at.set(g, []).get(g)).push(dummy.matrix.clone());
    if (blocks) solid.push({ x, z, r: k.t.options.branch.radius[0] * s });
  }
  for (const { t, at } of kinds) for (const [g, mats] of at) for (const src of [t.branchesMesh, t.leavesMesh]) {
    const m = new THREE.InstancedMesh(src.geometry, src.material, mats.length);
    mats.forEach((mat, i) => {
      m.setMatrixAt(i, mat);
      if (src === t.leavesMesh) m.setColorAt(i, tint.setRGB(rnd(.7, 1), rnd(.82, 1), rnd(.55, .85)));
    });
    m.castShadow = m.receiveShadow = true;
    g.add(m);
  }
  return spots.length;
}
const area = Math.PI * R * R;
const trees = scatter(
  ['Oak Medium', 'Oak Medium', 'Oak Large', 'Ash Medium', 'Ash Medium', 'Ash Large', 'Aspen Medium', 'Aspen Medium',
    'Aspen Large', 'Pine Medium', 'Pine Large', 'Pine Large'], area * (lite ? .006 : .0106) | 0, 4.5, 12, true);
const under = scatter(['Bush 1', 'Bush 2', 'Bush 3', 'Oak Small', 'Aspen Small', 'Pine Small'], area * (lite ? .004 : .007) | 0, 3, 10);
console.assert(trees > 100 && under > 50, 'forest came out too sparse', trees, under);

// Ground cover follows the walker: each plant has a home in one TILE, and the shader draws the copy nearest the camera,
// seats it on the terrain and shrinks it to nothing at the tile's edge.
const eye = { value: camera.position };
function carpet(geo, mat, N, [k0, k1], spread, [s0, s1], bare, seed) {
  mat.onBeforeCompile = s => {
    Object.assign(s.uniforms, { uTime: time, uEye: eye, uH: { value: hmap } });
    s.vertexShader = 'uniform float uTime; uniform vec3 uEye; uniform sampler2D uH;\n' + s.vertexShader
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float ph = instanceMatrix[3].x * .35 + instanceMatrix[3].z * .27;
        transformed.xz += position.y * position.y * .2 * vec2(sin(uTime * 1.7 + ph), cos(uTime * 1.3 + ph * 1.3));`)
      .replace('#include <project_vertex>', `
        vec4 wp = instanceMatrix * vec4(transformed, 1.);
        vec2 home = instanceMatrix[3].xz, at = mod(home - uEye.xz + ${TILE / 2}., ${TILE}.) - ${TILE / 2}. + uEye.xz;
        wp.xyz = vec3(at.x, 0., at.y) + (wp.xyz - vec3(home.x, 0., home.y)) * smoothstep(${TILE / 2}., ${TILE / 2 - 8}., distance(at, uEye.xz));
        wp.y += texture2D(uH, (at + 251.) / 502.).r;
        vec4 mvPosition = viewMatrix * wp;
        gl_Position = projectionMatrix * mvPosition;`)
      .replace('#include <worldpos_vertex>', 'vec4 worldPosition = wp;');
    noFlip(s);
  };
  const m = new THREE.InstancedMesh(geo, mat, N);
  for (let n = 0; n < N;) {
    const cx = rnd(0, TILE), cz = rnd(0, TILE);
    if (perlin.noise(cx * .08, seed, cz * .08) < bare) continue;      // leave bare patches
    for (let k = rnd(k0, k1) | 0; k > 0 && n < N; k--, n++) {
      dummy.position.set(cx + rnd(-spread, spread), -.02, cz + rnd(-spread, spread));
      dummy.rotation.set(0, rnd(0, 6.283), 0);
      dummy.scale.setScalar(rnd(s0, s1));
      dummy.updateMatrix();
      m.setMatrixAt(n, dummy.matrix);
      m.setColorAt(n, tint.setRGB(rnd(.8, 1.3), rnd(.8, 1.1), rnd(.5, 1)));
    }
  }
  m.frustumCulled = false;                                        // the shader moves it, so its bounds mean nothing
  m.receiveShadow = true;
  scene.add(m);
}
{ // Grass: tapered, bent blades in clumps
  const g = new THREE.PlaneGeometry(.12, 1, 1, 2).translate(0, .5, 0), p = g.attributes.position, col = [];
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    p.setX(i, p.getX(i) * (1 - y * y));
    p.setZ(i, .35 * y * y);
    g.attributes.normal.setXYZ(i, 0, 1, 0);                      // lit like the ground it grows from
    col.push(.05 + .17 * y, .1 + .26 * y, .03 + .07 * y);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  carpet(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }), lite ? 80000 : 150000, [8, 20], .3, [.18, .5], -.2, 9);
}
{ // Ferns: rosettes of arching fronds, the frond drawn once on a canvas
  const c = document.createElement('canvas'), x = c.getContext('2d');
  c.width = 128; c.height = 512;
  x.strokeStyle = '#5d7d30'; x.lineWidth = 3;
  x.beginPath(); x.moveTo(64, 512); x.lineTo(64, 8); x.stroke();
  for (let i = 0; i < 30; i++) {
    const t = i / 30, y = 500 - t * 488, len = 60 * (1 - t) ** .8 * Math.min(1, t * 5 + .3);
    x.fillStyle = `hsl(${rnd(80, 100)} 45% ${32 + 14 * t}%)`;
    for (const s of [-1, 1]) {
      x.beginPath(); x.ellipse(64 + s * len * .45, y - len * .22, len / 2, 5.5 - 3.5 * t, -s * .45, 0, 7); x.fill();
    }
  }
  const map = new THREE.CanvasTexture(c);
  map.colorSpace = THREE.SRGBColorSpace;
  const g = new THREE.PlaneGeometry(.3, 1, 1, 5).translate(0, .5, 0), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    p.setZ(i, .85 * y);
    p.setY(i, .55 * Math.sin(y * 2.2));                           // rises, then droops at the tip
    g.attributes.normal.setXYZ(i, 0, 1, 0);
  }
  carpet(g, new THREE.MeshLambertMaterial({ map, alphaTest: .4, side: THREE.DoubleSide }), lite ? 9000 : 21000, [6, 9], .04, [.5, 1.1], .15, 17);
}

// Boulders: noise-dented spheres, mossy on top, sunk into the ground
{
  const g = new THREE.SphereGeometry(1, 28, 20), p = g.attributes.position, v = new THREE.Vector3(), col = [];
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    v.multiplyScalar(1 + .35 * perlin.noise(v.x * 1.3, v.y * 1.3, v.z * 1.3) + .1 * perlin.noise(v.x * 4, v.y * 4, v.z * 4) + .03 * perlin.noise(v.x * 13, v.y * 13, v.z * 13));
    p.setXYZ(i, v.x, v.y * .7, v.z);
    const moss = THREE.MathUtils.smoothstep(v.y + .3 * perlin.noise(v.x * 3, 5, v.z * 3), .2, .8);
    col.push(.17 - .1 * moss, .165 - .05 * moss, .155 - .12 * moss);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const N = lite ? 90 : 160, rocks = new THREE.InstancedMesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95 }), N);
  for (let i = 0; i < N; i++) {
    const r = rnd(4, R), a = rnd(0, 6.283), x = r * Math.cos(a), z = r * Math.sin(a), s = rnd(.25, 1.3);
    dummy.position.set(x, height(x, z) - s * .2, z);
    dummy.rotation.set(rnd(-.3, .3), rnd(0, 6.283), rnd(-.3, .3));
    dummy.scale.set(s * rnd(.8, 1.4), s, s * rnd(.8, 1.4));
    dummy.updateMatrix();
    rocks.setMatrixAt(i, dummy.matrix);
    if (s > .45) solid.push({ x, z, r: s * .8 });
  }
  rocks.castShadow = rocks.receiveShadow = true;
  scene.add(rocks);
}

// Walking: keys or the on-screen stick move, dragging looks around
let yaw = -.1, pitch = .04, drift = !still, walked = 0, ground = height(0, 2) + EYE;
const pos = new THREE.Vector2(0, 2), move = new THREE.Vector2(), keys = new Set();
const down = (...codes) => codes.some(c => keys.has(c));
addEventListener('keydown', e => {
  keys.add(e.code);
  drift = false;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

const cv = renderer.domElement, stick = document.getElementById('stick');
let look = null;
cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); look = { id: e.pointerId, x: e.clientX, y: e.clientY }; drift = false; };
cv.onpointermove = e => {
  if (look?.id !== e.pointerId) return;
  const k = e.pointerType === 'touch' ? .005 : -.004;             // a finger turns the head toward the swipe; a mouse drags the view
  yaw -= (e.clientX - look.x) * k;
  pitch = THREE.MathUtils.clamp(pitch - (e.clientY - look.y) * k, -1.3, 1.3);
  look.x = e.clientX; look.y = e.clientY;
};
cv.onpointerup = cv.onpointercancel = e => { if (look?.id === e.pointerId) look = null; };
const steer = e => {
  const b = stick.getBoundingClientRect(), r = b.width / 2;
  move.set((e.clientX - b.left - r) / r, (e.clientY - b.top - r) / r).clampLength(0, 1);
  stick.firstElementChild.style.translate = `${move.x * r * .6}px ${move.y * r * .6}px`;
  drift = false;
};
stick.onpointerdown = e => { stick.setPointerCapture(e.pointerId); steer(e); };
stick.onpointermove = e => { if (stick.hasPointerCapture(e.pointerId)) steer(e); };
stick.onpointerup = stick.onpointercancel = () => { move.set(0, 0); stick.firstElementChild.style.translate = ''; };

new ResizeObserver(() => {
  const w = view.clientWidth, h = view.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}).observe(view);

// shortcut: only resolution adapts to a slow GPU; add tree LODs if phones still stutter
let last = 0, slow = 0;
renderer.setAnimationLoop(ms => {
  const dt = Math.min((ms - last) / 1000, .1);
  slow = ms - last > 45 ? slow + 1 : Math.max(0, slow - 1);
  last = ms;
  if (slow > 30 && renderer.getPixelRatio() > .8) { slow = 0; renderer.setPixelRatio(renderer.getPixelRatio() * .8); }
  if (!still) time.value = ms / 1000;

  if (drift) yaw += dt * .04;                                     // look around slowly until someone takes over
  yaw += (down('ArrowLeft') - down('ArrowRight')) * dt * 1.6;
  const fwd = down('KeyW', 'ArrowUp') - down('KeyS', 'ArrowDown') - move.y, side = down('KeyD') - down('KeyA') + move.x;
  const len = Math.hypot(fwd, side);
  if (len > 0) {
    const step = (down('ShiftLeft', 'ShiftRight') ? 6 : 2.6) * dt / Math.max(1, len);
    pos.x += (-Math.sin(yaw) * fwd + Math.cos(yaw) * side) * step;
    pos.y += (-Math.cos(yaw) * fwd - Math.sin(yaw) * side) * step;
    walked += len * step;
    for (const c of solid) {                                      // slide around trunks and boulders
      const dx = pos.x - c.x, dz = pos.y - c.z, d = Math.hypot(dx, dz), keep = c.r + .4;
      if (d < keep && d > 0) pos.set(c.x + dx / d * keep, c.z + dz / d * keep);
    }
    pos.clampLength(0, ROAM);
  }
  ground += (height(pos.x, pos.y) + EYE - ground) * Math.min(1, dt * 12);
  camera.position.set(pos.x, ground + (still ? 0 : .04 * Math.sin(walked * 8.4)), pos.y);   // one small bob per step
  camera.rotation.set(pitch, yaw, 0, 'YXZ');

  const bake = renderer.shadowMap.needsUpdate;                    // every tree must be in the frame that bakes the shadows
  for (const g of cells.values()) g.visible = bake || g.userData.mid.distanceTo(camera.position) < 120;
  renderer.render(scene, camera);
});
document.getElementById('stand').textContent = `참나무 · 물푸레나무 · 사시나무 · 소나무 ${trees}그루, 어린나무와 덤불 ${under}그루`;
</script>
