<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>치이카와 말랑이</title>
<style>
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: #fff5f7; color: #5a4a42; text-align: center;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  h1 { margin: 0; font-size: 2rem; }
  p { margin: 0; }
  main { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 24px; }
  button {
    width: min(70vw, 240px); padding: 0; border: 0; background: none; cursor: pointer;
    font: inherit; color: inherit; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  button:focus-visible { outline: 3px solid #ff8fab; outline-offset: 6px; border-radius: 24px; }
  svg {
    display: block; overflow: visible; transform-origin: 50% 100%;
    /* 손을 떼면 출렁이며 돌아오도록 오버슈트 곡선 */
    transition: transform .6s cubic-bezier(.2, 2.6, .4, .8);
  }
  button:active svg { transform: scale(1.3, .6); transition: transform .08s; }
  .body, .ear { stroke: #5a4a42; stroke-width: 3; stroke-linejoin: round; fill: #fff; }
  .line { stroke: #5a4a42; stroke-width: 3; stroke-linecap: round; fill: none; }
  footer { font-size: .8rem; opacity: .7; }
</style>
</head>
<!-- ontouchstart: iOS 사파리에서 :active가 동작하려면 터치 리스너가 필요 -->
<body ontouchstart>
<h1>치이카와 말랑이</h1>
<p>꾹 눌러서 말랑말랑!</p>

<svg width="0" height="0" aria-hidden="true">
  <symbol id="face" viewBox="0 0 120 110">
    <circle cx="42" cy="62" r="4.5" fill="#3a2e28"/>
    <circle cx="78" cy="62" r="4.5" fill="#3a2e28"/>
    <ellipse cx="29" cy="75" rx="9" ry="5" fill="#ffb3c1"/>
    <ellipse cx="91" cy="75" rx="9" ry="5" fill="#ffb3c1"/>
    <path class="line" d="M54 72q6 6 12 0"/>
  </symbol>
</svg>

<main>
  <button>
    <svg viewBox="0 0 120 110" aria-hidden="true">
      <circle class="ear" cx="26" cy="30" r="12"/>
      <circle class="ear" cx="94" cy="30" r="12"/>
      <ellipse class="body" cx="60" cy="66" rx="52" ry="42"/>
      <use href="#face"/>
    </svg>
    곰 말랑이
  </button>
  <button>
    <svg viewBox="0 0 120 110" aria-hidden="true">
      <path class="ear" style="fill:#bfe3ff" d="M14 44 22 10 48 30Z"/>
      <path class="ear" style="fill:#bfe3ff" d="M106 44 98 10 72 30Z"/>
      <ellipse class="body" cx="60" cy="66" rx="52" ry="42"/>
      <use href="#face"/>
    </svg>
    고양이 말랑이
  </button>
  <button>
    <svg viewBox="0 0 120 110" aria-hidden="true">
      <ellipse class="ear" style="fill:#fff3c4" cx="40" cy="22" rx="9" ry="22"/>
      <ellipse class="ear" style="fill:#fff3c4" cx="80" cy="22" rx="9" ry="22"/>
      <ellipse class="body" style="fill:#fff3c4" cx="60" cy="66" rx="52" ry="42"/>
      <use href="#face"/>
    </svg>
    토끼 말랑이
  </button>
</main>

<footer>비공식 팬 페이지입니다. 공식 캐릭터 이미지는 포함되어 있지 않습니다.</footer>
</body>
</html>
