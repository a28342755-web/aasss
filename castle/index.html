<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Larkspire Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:wght@700&family=Spectral:wght@400;600&display=swap">
<style>
/* Layout: one full-bleed 3D canvas. The HUD floats on it: place name and fast-travel chips on top,
   controls hint at the bottom. The title card sits bottom-left so the castle stays in view. */
:root{
  --night:#0d0b1e; --ink:#f3ead6; --muted:#b9b0c9; --gold:#e9c46a; --panel:rgba(16,13,34,.78); --line:rgba(233,196,106,.38);
  --display:'Almendra','Palatino Linotype',Georgia,serif; --body:'Spectral',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font:400 15px/1.45 var(--body);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;pointer-events:none;
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud{justify-content:space-between;gap:12px}
#loc{font:700 clamp(20px,4vw,28px)/1.1 var(--display);letter-spacing:.02em;text-shadow:0 2px 12px var(--night)}
#places{display:flex;gap:8px;overflow-x:auto;margin-top:8px;pointer-events:auto;scrollbar-width:none}
button{font:600 13px/1 var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#help{align-self:flex-start;color:var(--muted);font-size:13px;background:var(--panel);padding:6px 10px;border-radius:6px}
#intro{justify-content:flex-end;align-items:flex-start;gap:12px;pointer-events:auto;background:linear-gradient(to top,var(--night) 5%,transparent 75%)}
#intro h1{margin:0;font:700 clamp(38px,9vw,76px)/1 var(--display);color:var(--gold);text-wrap:balance}
#intro p{margin:0;max-width:52ch}
#go{font-size:16px;padding:12px 20px;background:var(--gold);color:var(--night);border-color:var(--gold)}
</style>

<canvas id="c" tabindex="0" aria-label="3D view of Larkspire Academy"></canvas>
<div id="hud" class="overlay">
  <div><div id="loc"></div><nav id="places" aria-label="Fly to"></nav></div>
  <div id="help"></div>
</div>
<div id="intro" class="overlay">
  <h1>Larkspire Academy</h1>
  <p>An old school of the arcane arts on a crag above the lake. Take a broom and look around. The Grand Hall, the library, the alchemy hall, the greenhouse and the observatory on top of the Star Tower are all open.</p>
  <button id="go">Mount your broom</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{'use strict';
const T=THREE,PI=Math.PI,$=id=>document.getElementById(id),cv=$('c');
let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647,R=(a,b)=>a+rnd()*(b-a),pick=a=>a[rnd()*a.length|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let renderer;
try{renderer=new T.WebGLRenderer({canvas:cv,antialias:true})}catch(e){$('intro').querySelector('p').textContent='This device could not start WebGL, so the castle cannot be drawn here.';$('go').hidden=true;return}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
const FOG=0x2b2547,scene=new T.Scene();scene.fog=new T.FogExp2(FOG,.0015);renderer.setClearColor(FOG);
const cam=new T.PerspectiveCamera(70,1,.15,3000);scene.add(cam);

// ---------- procedural textures ----------
function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=4;return t}
const speck=(g,w,h,n,cols)=>{for(let i=0;i<n;i++){g.fillStyle=pick(cols);g.fillRect(R(0,w),R(0,h),R(1,3),R(1,3))}};
const tStone=tex(256,256,(g,w,h)=>{g.fillStyle='#55524f';g.fillRect(0,0,w,h);
  for(let r=0;r<8;r++)for(let c=-1;c<4;c++){const v=R(125,170)|0;g.fillStyle=`rgb(${v},${v-3},${v-8})`;g.fillRect(c*64+(r%2)*32+2,r*32+2,60,28)}
  speck(g,w,h,1800,['rgba(0,0,0,.09)','rgba(255,255,255,.07)'])});
const tSlate=tex(128,128,(g,w,h)=>{g.fillStyle='#161b28';g.fillRect(0,0,w,h);
  for(let r=0;r<8;r++)for(let c=-1;c<8;c++){const v=R(44,70)|0;g.fillStyle=`rgb(${v},${v+8},${v+24})`;g.fillRect(c*16+(r%2)*8+1,r*16+1,14,15)}});
const tWood=tex(128,128,(g,w,h)=>{g.fillStyle='#6f4c2f';g.fillRect(0,0,w,h);
  for(let i=0;i<4;i++){g.fillStyle=`rgba(0,0,0,${R(0,.18)})`;g.fillRect(i*32,0,32,h);g.fillStyle='#2e1f12';g.fillRect(i*32,0,1.5,h)}
  for(let i=0;i<220;i++){g.fillStyle='rgba(30,15,5,.18)';g.fillRect(R(0,w),R(0,h),1,R(6,30))}});
const tFloor=tex(128,128,(g,w,h)=>{for(let i=0;i<4;i++){g.fillStyle=(i==0||i==3)?'#8f887c':'#4a474e';g.fillRect((i%2)*64,(i>>1)*64,64,64)}
  g.strokeStyle='#2a282c';g.lineWidth=2;g.strokeRect(0,0,64,64);g.strokeRect(64,64,64,64);speck(g,w,h,500,['rgba(0,0,0,.08)','rgba(255,255,255,.05)'])});
const tBooks=tex(256,256,(g,w,h)=>{g.fillStyle='#22150b';g.fillRect(0,0,w,h);
  for(let r=0;r<4;r++){let x=2;while(x<w-6){const bw=R(7,15),bh=R(38,54);g.fillStyle=pick(['#7a2222','#234a2f','#1f3157','#6b4a1d','#4a2356','#8a6a2a','#30303a','#7d3a1a']);
    g.fillRect(x,r*64+58-bh,bw-1,bh);g.fillStyle='rgba(233,196,106,.7)';g.fillRect(x,r*64+64-bh,bw-1,2);x+=bw}
    g.fillStyle='#4a3018';g.fillRect(0,r*64+58,w,6)}});
const tWin=tex(64,128,(g,w,h)=>{const p=new Path2D();p.moveTo(4,h-3);p.lineTo(4,44);p.quadraticCurveTo(4,10,32,3);p.quadraticCurveTo(60,10,60,44);p.lineTo(60,h-3);p.closePath();
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#fff1b8');gr.addColorStop(1,'#ff9a3d');g.fillStyle=gr;g.fill(p);
  g.save();g.clip(p);g.strokeStyle='#3a2410';g.lineWidth=2;for(let i=-128;i<128;i+=16){g.beginPath();g.moveTo(i,0);g.lineTo(i+128,128);g.moveTo(i+128,0);g.lineTo(i,128);g.stroke()}g.restore();
  g.lineWidth=5;g.strokeStyle='#2a1a0c';g.stroke(p)});
const tRose=tex(256,256,g=>{g.translate(128,128);g.fillStyle='#1a1020';g.beginPath();g.arc(0,0,127,0,7);g.fill();
  for(let k=0;k<3;k++)for(let i=0;i<12;i++){g.rotate(PI/6);g.fillStyle=`hsl(${(i*30+k*50)%360},80%,${58-k*8}%)`;g.beginPath();g.ellipse(0,-(100-k*34),14-k*3,24-k*5,0,0,7);g.fill()}
  g.fillStyle='#ffd980';g.beginPath();g.arc(0,0,14,0,7);g.fill()});
const banner=(col,n)=>tex(64,128,(g,w,h)=>{g.fillStyle=col;g.fillRect(0,0,w,h);g.strokeStyle='#e9c46a';g.lineWidth=4;g.strokeRect(4,4,w-8,h-8);
  g.fillStyle='#e9c46a';g.beginPath();for(let i=0;i<n*2;i++){const a=i*PI/n,r=i%2?8:20;g.lineTo(32+Math.sin(a)*r,56-Math.cos(a)*r)}g.fill()});
const tClock=tex(128,128,g=>{g.translate(64,64);g.fillStyle='#f4e6b8';g.beginPath();g.arc(0,0,62,0,7);g.fill();g.strokeStyle='#3a2a12';g.lineWidth=5;g.stroke();
  g.fillStyle='#3a2a12';for(let i=0;i<12;i++){g.rotate(PI/6);g.fillRect(-2,-56,4,i%3==2?16:9)}
  g.lineWidth=5;g.beginPath();g.moveTo(0,0);g.lineTo(18,-22);g.stroke();g.lineWidth=3;g.beginPath();g.moveTo(0,0);g.lineTo(-30,-34);g.stroke()});
const tStar=tex(512,512,(g,w)=>{g.fillStyle='#0c1030';g.fillRect(0,0,w,w);g.translate(256,256);g.strokeStyle='rgba(233,196,106,.7)';g.lineWidth=2;
  for(const r of[250,200,140,90]){g.beginPath();g.arc(0,0,r,0,7);g.stroke()}
  for(let i=0;i<12;i++){g.rotate(PI/6);g.beginPath();g.moveTo(0,90);g.lineTo(0,250);g.stroke()}
  g.fillStyle='#fff';g.strokeStyle='rgba(255,255,255,.4)';let px,py;
  for(let i=0;i<130;i++){const a=R(0,7),r=R(95,245),x=Math.cos(a)*r,y=Math.sin(a)*r;g.beginPath();g.arc(x,y,R(1,3),0,7);g.fill();
    if(i%4&&Math.hypot(x-px,y-py)<110){g.beginPath();g.moveTo(px,py);g.lineTo(x,y);g.stroke()}px=x;py=y}});
const tGlobe=tex(128,64,(g,w,h)=>{g.fillStyle='#2f5f8a';g.fillRect(0,0,w,h);g.fillStyle='#7d9453';for(let i=0;i<14;i++){g.beginPath();g.ellipse(R(0,w),R(8,h-8),R(6,18),R(4,10),R(0,3),0,7);g.fill()}});
const tRug=tex(512,64,(g,w,h)=>{g.fillStyle='#6e1f28';g.fillRect(0,0,w,h);g.strokeStyle='#e9c46a';g.lineWidth=3;g.strokeRect(5,5,w-10,h-10);
  g.fillStyle='#c9a24a';for(let x=24;x<w;x+=32){g.save();g.translate(x,32);g.rotate(PI/4);g.fillRect(-7,-7,14,14);g.restore()}});
const tBoard=tex(256,128,(g,w,h)=>{g.fillStyle='#1d3a2c';g.fillRect(0,0,w,h);g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=1.5;
  g.beginPath();g.arc(62,64,40,0,7);g.stroke();g.strokeRect(36,38,52,52);g.save();g.translate(62,64);g.rotate(PI/4);g.strokeRect(-26,-26,52,52);g.restore();
  for(let r=0;r<5;r++){g.beginPath();let x=124;g.moveTo(x,24+r*20);while(x<238){x+=R(4,12);g.lineTo(x,24+r*20+R(-6,6))}g.stroke()}});
const tGrass=tex(128,128,(g,w,h)=>{g.fillStyle='#a3a39a';g.fillRect(0,0,w,h);speck(g,w,h,2600,['rgba(40,60,40,.22)','rgba(255,255,230,.14)'])});
const tGlow=tex(64,64,g=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(255,220,150,.5)');gr.addColorStop(1,'rgba(255,200,120,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)});

// ---------- materials ----------
const M=(map,color=0xffffff,o)=>new T.MeshPhongMaterial(Object.assign({color,shininess:8},map&&{map},o));
const B=(color,map)=>new T.MeshBasicMaterial(Object.assign({color},map&&{map}));
const DS={side:T.DoubleSide};
const mStone=M(tStone,0xc4c1cc),mStoneW=M(tStone,0xe2cfae),mStoneD=M(tStone,0x8f8c99),mPave=M(tStone,0xa39c90),
 mSlate=M(tSlate,0xffffff,DS),mWood=M(tWood),mWoodD=M(tWood,0x8a705c),mFloor=M(tFloor),mBooks=M(tBooks),mRug=M(tRug),mBoard=M(tBoard),
 mGlobe=M(tGlobe),mStar=M(tStar,0xffffff,DS),mIron=M(0,0x2c2c34,{shininess:40}),mIronD=M(0,0x2c2c34,{shininess:40,side:T.DoubleSide}),
 mBrass=M(0,0xcaa24a,{shininess:80,specular:0x886622}),mPewter=M(0,0xaab0b8,{shininess:60}),mCopper=M(0,0xb8733a,{shininess:70,specular:0x664422}),
 mVerdigris=M(0,0x2f6a5c,{shininess:30,side:T.DoubleSide}),mLeaf=M(0,0x234f30),mLeaf2=M(0,0x3f7a3c),mTrunk=M(0,0x4a3524),mSoil=M(0,0x3a2a1e),
 mPumpkin=M(0,0xd9772a),mPaper=M(0,0xe9e2cf),mWax=M(0,0xf2ead2),mFlag=M(0,0x8b2334),mBroom=M(0,0x7a5633),
 mGlass=M(0,0xa9e0d8,{transparent:true,opacity:.2,side:T.DoubleSide,depthWrite:false,shininess:90}),
 mPool=M(0,0x2f6f9a,{shininess:100,emissive:0x0a2a44}),
 mBan=[banner('#7a1f2b',5),banner('#1d3f5e',4),banner('#27503a',8)].map(t=>M(t)),
 mFlame=B(0xffc56a),mEmber=B(0xff7a2a),mWarm=B(0xffe2a0),mGlow=[B(0x66ff88),B(0xc27bff),B(0x6fe3ff)],
 mWin=new T.MeshBasicMaterial({map:tWin,alphaTest:.5}),mRose=B(0xffffff,tRose),mClock=B(0xffffff,tClock);

// ---------- geometry batching: everything static is merged into one mesh per material ----------
const batch=new Map();let cur=null;
function put(mat,g,x=0,y=0,z=0,ry=0){if(ry)g.rotateY(ry);g.translate(x,y,z);if(cur)g.applyMatrix4(cur);if(g.index)g=g.toNonIndexed();let a=batch.get(mat);if(!a)batch.set(mat,a=[]);a.push(g)}
function flush(){for(const[mat,gs]of batch){let n=0,o=0;for(const g of gs)n+=g.attributes.position.count;
  const P=new Float32Array(n*3),N=new Float32Array(n*3),U=new Float32Array(n*2);
  for(const g of gs){P.set(g.attributes.position.array,o*3);N.set(g.attributes.normal.array,o*3);U.set(g.attributes.uv.array,o*2);o+=g.attributes.position.count}
  const m=new T.BufferGeometry();m.setAttribute('position',new T.BufferAttribute(P,3));m.setAttribute('normal',new T.BufferAttribute(N,3));m.setAttribute('uv',new T.BufferAttribute(U,2));
  scene.add(new T.Mesh(m,mat))}batch.clear()}
// at(): build in local coordinates (nestable); W(): local point -> world
function at(x,z,ry,fn,y=0){const prev=cur,m=new T.Matrix4().makeRotationY(ry).setPosition(x,y,z);cur=prev?prev.clone().multiply(m):m;fn();cur=prev}
const W=(x,y,z)=>{const v=new T.Vector3(x,y,z);return cur?v.applyMatrix4(cur):v};
function dyn(){const g=new T.Group();if(cur)g.applyMatrix4(cur);scene.add(g);return g}
function light(color,i,dist,x,y,z){const l=new T.PointLight(color,i,dist);l.position.copy(W(x,y,z));scene.add(l);return l}

// primitives: y is the BASE of the shape; tile = metres per texture repeat (0 = stretch once)
function box(mat,w,h,d,x,y,z,ry=0,tile=4){const g=new T.BoxGeometry(w,h,d);
  if(tile){const uv=g.attributes.uv,s=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];for(let i=0;i<24;i++)uv.setXY(i,uv.getX(i)*s[i>>2][0]/tile,uv.getY(i)*s[i>>2][1]/tile)}
  put(mat,g,x,y+h/2,z,ry)}
function cyl(mat,rt,rb,h,x,y,z,seg=12,tile=4,ry=0,flat=0){let g=new T.CylinderGeometry(rt,rb,h,seg);
  if(tile){const uv=g.attributes.uv,k=Math.round(6.283*Math.max(rt,rb)/tile)||1;for(let i=0;i<(seg+1)*2;i++)uv.setXY(i,uv.getX(i)*k,uv.getY(i)*h/tile)}
  if(flat){g=g.toNonIndexed();g.computeVertexNormals()}put(mat,g,x,y+h/2,z,ry)}
function sph(mat,r,x,y,z,sy=1,seg=10){const g=new T.SphereGeometry(r,seg,Math.max(6,seg*.7|0));if(sy!==1)g.scale(1,sy,1);put(mat,g,x,y,z)}
function tri(mat,a,b,c){for(const v of[[a,b,c],[a,c,b]]){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(v.flat(),3));
  g.setAttribute('uv',new T.Float32BufferAttribute(v.flatMap(p=>[p[2]/4,p[1]/4]),2));g.computeVertexNormals();put(mat,g)}}

// wall from (x1,z1) to (x2,z2). o.gaps=[[centre,width,height]] door openings, o.win=[count,y,w,h] lit windows, o.cren battlements
function wall(mat,x1,z1,x2,z2,h,t,o={}){const L=Math.hypot(x2-x1,z2-z1),ux=(x2-x1)/L,uz=(z2-z1)/L,ry=Math.atan2(-uz,ux),y=o.y||0,gaps=(o.gaps||[]).sort((a,b)=>a[0]-b[0]);
  const seg=(a,b,y0,hh)=>{if(b-a>.01&&hh>.01)box(mat,b-a,hh,t,x1+ux*(a+b)/2,y0,z1+uz*(a+b)/2,ry)};
  let p=0;for(const[c,w,gh]of gaps){seg(p,c-w/2,y,h);seg(c-w/2,c+w/2,y+gh,h-gh);p=c+w/2}seg(p,L,y,h);
  if(o.cren)for(let s=.8;s<L-.6;s+=2.6)box(mat,1.4,1.3,t,x1+ux*s,y+h,z1+uz*s,ry);
  if(o.win){const[n,wy,ww,wh]=o.win;for(let i=0;i<n;i++){const s=L*(i+.5)/n;if(!gaps.some(([c,w])=>Math.abs(s-c)<w/2+ww/2))box(mWin,ww,wh,t+.16,x1+ux*s,y+wy,z1+uz*s,ry,0)}}}
// n-sided hollow tower shell; o.gap(i) -> [width,height] opening in side i. Side 0 faces +x, side n/4 faces +z.
function ring(mat,x,z,r,h,n,t,o={}){const out=[],e=t/2*Math.tan(PI/n);for(let i=0;i<n;i++){
  const a0=(i-.5)*2*PI/n,a1=(i+.5)*2*PI/n,c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1),L=Math.hypot(c1-c0,s1-s0)*r,ux=(c1-c0)*r/L,uz=(s1-s0)*r/L,g=o.gap&&o.gap(i);
  wall(mat,x+c0*r-ux*e,z+s0*r-uz*e,x+c1*r+ux*e,z+s1*r+uz*e,h,t,{y:o.y,cren:o.cren,gaps:g&&[[L/2+e,g[0],g[1]]]});
  out.push({x:x+(c0+c1)/2*r,z:z+(s0+s1)/2*r,ry:Math.atan2(-uz,ux)})}return out}
// gabled roof, ridge along local x, eaves resting on walls of depth d at height y
function roof(mat,len,d,rh,y){const k=(d/2+.9)/(d/2),D=d*k,H=rh*k,g=new T.CylinderGeometry(1,1,len,2,1,true,-PI/6,PI*4/3).toNonIndexed(),uv=g.attributes.uv,sl=Math.hypot(D/2,H);
  for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getY(i)*len/4,uv.getX(i)*2*sl/4);
  g.rotateZ(PI/2);g.scale(1,H/1.5,D/1.732);g.computeVertexNormals();put(mat,g,0,y+rh-H*2/3,0)}
// solid round tower with a witch-hat roof (o.roof:0 = flat battlemented top)
function tower(x,z,r,h,o={}){const m=o.mat||mStone,y0=o.y0===undefined?-8:o.y0,rh=o.roof===undefined?r*2.5:o.roof;
  cyl(m,r,r*1.05,h-y0,x,y0,z,16);cyl(m,r*1.16,r,1,x,h,z,16);cyl(m,r*1.16,r*1.16,1.2,x,h+1,z,16);
  if(rh){cyl(mSlate,0,r*1.3,rh,x,h+2.2,z,16);cyl(mIron,.07,.07,3.2,x,h+1.9+rh,z,4,0);box(mFlag,2,1.1,.06,x+1,h+3.9+rh,z,0,0)}
  else for(let i=0;i<16;i+=2){const a=i*PI/8;box(m,r*.42,1.1,.6,x+Math.sin(a)*r*1.1,h+2.2,z+Math.cos(a)*r*1.1,a)}
  for(let yy=7;yy<h-3;yy+=7)for(let k=0;k<3;k++){const a=yy*.9+k*2.1;box(mWin,.9,2.2,.6,x+Math.sin(a)*r*1.04,yy,z+Math.cos(a)*r*1.04,a,0)}}
// rectangular building in local coords: long axis x, door side +z ("S")
function hall(m,w,d,h,rh,o={}){const x=w/2,z=d/2,t=1.2,S=o.S||[];
  wall(m,-x,z,x,z,h,t,{gaps:S,win:o.win});wall(m,-x,-z,x,-z,h,t,{win:o.win});wall(m,-x,-z,-x,z,h,t,{gaps:o.W});wall(m,x,-z,x,z,h,t,{gaps:o.E});

// ---------- controls ----------
const keys={},pos=cam.position,vel=new T.Vector3(),drag=new Map();
let yaw=0,pitch=0,roll=0,spin=0,sx=0,sy=0,stick=null,ox=0,oy=0,tt=0,here=null,last=performance.now();
function look(dx,dy){yaw-=dx*.0024;pitch=clamp(pitch-dy*.0024,-1.5,1.5);spin+=dx}
function go(z){pos.copy(z.v);vel.set(0,0,0);const d=z.t.clone().sub(z.v);yaw=Math.atan2(-d.x,-d.z);pitch=Math.atan2(d.y,Math.hypot(d.x,d.z))}
function start(){$('intro').hidden=true;cv.focus()}
addEventListener('keydown',e=>{keys[e.code]=1;if(/^(Space|Arrow)/.test(e.code))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=0});addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
cv.addEventListener('pointerdown',e=>{start();
  if(e.pointerType==='mouse'){const p=cv.requestPointerLock&&cv.requestPointerLock();p&&p.catch&&p.catch(()=>{})}   // optional: falls back to drag-to-look
  else{try{cv.setPointerCapture(e.pointerId)}catch(_){}if(stick===null&&e.clientX<innerWidth*.4){stick=e.pointerId;ox=e.clientX;oy=e.clientY}}
  drag.set(e.pointerId,[e.clientX,e.clientY])});
cv.addEventListener('pointermove',e=>{const p=drag.get(e.pointerId);
  if(e.pointerId===stick){sx=clamp((e.clientX-ox)/50,-1,1);sy=clamp((e.clientY-oy)/50,-1,1)}
  else if(document.pointerLockElement===cv)look(e.movementX,e.movementY);
  else if(p){look((e.clientX-p[0])*2,(e.clientY-p[1])*2);p[0]=e.clientX;p[1]=e.clientY}});
const lift=e=>{drag.delete(e.pointerId);if(e.pointerId===stick){stick=null;sx=sy=0}};cv.addEventListener('pointerup',lift);cv.addEventListener('pointercancel',lift);
$('go').onclick=start;
for(const z of zones){const b=document.createElement('button');b.textContent=z.name;b.onclick=()=>{go(z);start()};$('places').appendChild(b)}
$('help').textContent=matchMedia('(pointer:coarse)').matches?'Left thumb: drag to fly · Right thumb: drag to look':'W A S D fly · Mouse look · Space / C rise and sink · Shift sprint';

function fit(){const w=cv.clientWidth,h=cv.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();

function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;tt+=dt;
  const k=keys,f=(k.KeyW?1:0)-(k.KeyS?1:0)-sy,s=(k.KeyD?1:0)-(k.KeyA?1:0)+sx,u=(k.Space||k.KeyE?1:0)-(k.KeyC||k.KeyQ?1:0);
  const turn=(k.ArrowRight?1:0)-(k.ArrowLeft?1:0),nod=(k.ArrowUp?1:0)-(k.ArrowDown?1:0);if(turn||nod)look(turn*dt*520,-nod*dt*400);
  roll+=(clamp(-spin*.012,-.3,.3)-roll)*Math.min(1,dt*5);spin*=Math.exp(-7*dt);
  cam.rotation.set(pitch,yaw,roll,'YXZ');
  const inside=z=>z.b.containsPoint(pos),z=zones.find(z=>z.indoor&&inside(z))||zones.find(inside),acc=(z&&z.indoor?26:70)*(k.ShiftLeft||k.ShiftRight?2.6:1);
  vel.addScaledVector(new T.Vector3(0,0,-1).applyEuler(cam.rotation),f*acc*dt).addScaledVector(new T.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),s*acc*.7*dt);vel.y+=u*acc*.7*dt;
  vel.multiplyScalar(Math.exp(-2.2*dt));pos.addScaledVector(vel,dt);

  const floor=Math.max(ground(pos.x,pos.z),WATER)+1.4;if(pos.y<floor){pos.y=floor;vel.y=Math.max(0,vel.y)}if(pos.y>320)pos.y=320;
  const name=z?z.name:pos.y>75?'High over Larkspire':Math.abs(pos.x)<WX&&pos.z>WN&&pos.z<WS?'Castle Rooftops':'Larkspire Grounds';
  if(name!==here)$('loc').textContent=here=name;
  sky.position.copy(pos);broom.position.set(0,-.4+Math.sin(tt*1.7)*.012,-.05);broom.rotation.z=-roll*1.5;
  for(const p of orrery)p.rotation.y+=p.userData.w*dt;
