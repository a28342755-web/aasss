<meta charset="utf-8">
<title>찌올림</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 화면 전체가 3D 저수지. HUD는 가장자리에만 붙고, 찌가 서 있는 가운데 수면은 비워 둔다. */
:root {
  --lake: #0a1211;                    /* 깊은 저수지 물빛, 바탕 */
  --glass: rgba(9, 18, 17, .52);      /* HUD 유리판 */
  --glass-hi: rgba(8, 15, 14, .88);
  --mist: #e8eee8;                    /* 물안개 흰색, 본문 */
  --mist-2: rgba(232, 238, 232, .72);
  --mist-3: rgba(232, 238, 232, .45);
  --hair: rgba(232, 238, 232, .17);
  --float: #ff5b2e;                   /* 찌톱 형광 주황 — 강조색 */
  --band: #ffd34a;                    /* 찌톱 노랑 마디 — 경고 */
  --jade: #9cd8bf;                    /* 잔잔한 물 — 안전 */
  --f-display: "Hahmlet", "Noto Serif KR", "AppleMyungjo", serif;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--lake); color: var(--mist); font: 14px/1.45 var(--f-ui); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#gl { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--band); outline-offset: 2px; }
.shadowed { text-shadow: 0 1px 2px rgba(0, 0, 0, .55), 0 0 12px rgba(0, 0, 0, .25); }

#hud { position: fixed; inset: 0; pointer-events: none; display: grid; gap: 10px;
  grid-template-columns: auto 1fr auto; grid-template-rows: auto 1fr auto auto;
  grid-template-areas: "status status log" "scope . gauge" "hint hint hint" "info . controls";
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px)); }
#status { grid-area: status; justify-self: start; align-self: start; display: flex; align-items: baseline; gap: 2px 12px; flex-wrap: wrap; min-width: 0;
  padding: 5px 14px; border-radius: 18px; background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
#clock { font-size: 22px; font-weight: 500; letter-spacing: .02em; }
#cond { font-size: 12px; color: var(--mist-2); }
#logBtn { grid-area: log; align-self: start; justify-self: end; }
#scope { grid-area: scope; align-self: start; position: relative; width: clamp(128px, 31vmin, 300px); aspect-ratio: 1; max-width: 100%;
  border: 1px solid rgba(232, 238, 232, .55); box-shadow: 0 0 0 1px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .35); }
#scope .tag { position: absolute; top: 5px; left: 7px; font-size: 11px; letter-spacing: .08em; color: var(--mist); }
#scope .tag.right { left: auto; right: 7px; }
#gauge { grid-area: gauge; align-self: center; justify-self: end; display: grid; justify-items: center; gap: 6px; font-size: 12px; }
.meter { position: relative; height: min(34vh, 230px); width: 14px; }
.track { position: absolute; inset: 0; border-radius: 7px; background: rgba(0, 0, 0, .38); border: 1px solid var(--hair); overflow: hidden; }
#gFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--jade); }
#gDrag { position: absolute; left: -6px; right: -6px; height: 2px; background: var(--mist); box-shadow: 0 0 0 1px rgba(0, 0, 0, .4); }
.g-label { color: var(--mist-2); font-size: 11px; }
#hint { grid-area: hint; justify-self: center; max-width: min(560px, 100%); text-align: center; font-size: 14px; padding: 8px 16px;
  background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-radius: 999px; transition: opacity .3s; }
#hint:empty { opacity: 0; }
#info { grid-area: info; align-self: end; justify-self: start; font-size: 11.5px; line-height: 1.65; color: var(--mist-2); max-width: 48vw;
  padding: 6px 12px; border-radius: 10px; background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
#info:has(#info2:empty) #info2 { display: none; }
#controls { grid-area: controls; display: flex; align-items: flex-end; gap: 10px; pointer-events: auto; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.pill { pointer-events: auto; border: 1px solid var(--hair); background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-radius: 999px; padding: 8px 15px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.pill:hover { border-color: var(--mist-3); }
.pill.net { background: var(--float); border-color: transparent; color: #1c0d06; font-weight: 600; font-size: 15px; padding: 11px 20px; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(255, 91, 46, .25); } }
.drag { display: flex; align-items: center; border: 1px solid var(--hair); border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.drag button { width: 36px; height: 36px; border: 0; background: none; font-size: 18px; cursor: pointer; border-radius: 50%; }
.drag span { display: grid; justify-items: center; min-width: 46px; line-height: 1.1; }
.drag small { font-size: 10px; color: var(--mist-2); }
.drag b { font-size: 14px; font-weight: 500; }
#action { position: relative; width: 92px; height: 92px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; touch-action: none;
  background: radial-gradient(circle at 50% 38%, rgba(30, 44, 42, .78), rgba(8, 14, 13, .82)); display: grid; place-items: center;
  font-weight: 600; font-size: 15px; letter-spacing: .02em; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); }
#action:active { transform: scale(.97); }
#action svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
#action .ring { fill: none; stroke: rgba(232, 238, 232, .25); stroke-width: 3; }
#action .arc { fill: none; stroke: var(--float); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 289; }
#action[disabled] { opacity: .45; cursor: default; }
#toast { position: fixed; z-index: 4; left: 50%; top: max(64px, calc(env(safe-area-inset-top, 0px) + 52px)); transform: translateX(-50%);
  max-width: min(520px, calc(100vw - 32px)); text-align: center; padding: 10px 16px; border-radius: 10px; background: var(--glass-hi);
  border: 1px solid var(--hair); font-weight: 500; opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.on { opacity: 1; }

#title { position: fixed; inset: 0; z-index: 8; display: flex; align-items: flex-end;
  background: linear-gradient(90deg, rgba(6, 12, 11, .84) 0%, rgba(6, 12, 11, .5) 42%, rgba(6, 12, 11, 0) 72%), linear-gradient(0deg, rgba(6, 12, 11, .55), rgba(6, 12, 11, 0) 55%);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.title-inner { display: grid; gap: 16px; max-width: 540px; min-width: 0; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: .16em; color: var(--mist-2); }
#title h1 { margin: 0; font: 700 clamp(64px, 15vw, 136px)/.92 var(--f-display); letter-spacing: -.035em; display: flex; align-items: flex-end; gap: .14em; text-wrap: balance; }
.mini-float { position: relative; width: 12px; height: .92em; overflow: hidden; border-bottom: 2px solid var(--mist-3); flex: none; }
.mini-float i { position: absolute; left: 4px; bottom: -48%; width: 4px; height: 120%; border-radius: 2px 2px 0 0;
  background: repeating-linear-gradient(to bottom, var(--float) 0 9%, var(--band) 9% 18%, #3fd18a 18% 27%); animation: rise 6s ease-in-out infinite; }
@keyframes rise { 0%, 35% { transform: translateY(0); } 58%, 72% { transform: translateY(-30%); } 100% { transform: translateY(0); } }
.lede { margin: 0; font-size: 15px; line-height: 1.65; color: var(--mist-2); max-width: 38ch; text-wrap: pretty; }
.times { display: flex; flex-wrap: wrap; gap: 8px; }
.times button { border: 1px solid var(--hair); background: rgba(9, 18, 17, .45); border-radius: 999px; padding: 7px 13px; cursor: pointer; font-size: 13px; }
.times button span { font-family: var(--f-num); font-size: 12px; color: var(--mist-2); margin-left: 6px; }
.times button[aria-pressed="true"] { border-color: var(--mist); background: rgba(232, 238, 232, .14); }
#startBtn { justify-self: start; border: 0; border-radius: 999px; padding: 14px 28px; background: var(--float); color: #1c0d06; font-weight: 600; font-size: 16px; cursor: pointer; }
#startBtn[disabled] { opacity: .6; cursor: progress; }
.keys { margin: 0; font-size: 12px; color: var(--mist-3); max-width: 52ch; }
.err { margin: 0; color: var(--band); font-size: 13px; }

#card { position: fixed; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%);
  width: min(360px, calc(100vw - 32px)); display: grid; gap: 12px; padding: 20px; border-radius: 14px;
  background: var(--glass-hi); border: 1px solid var(--hair); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
#card .card-name { margin: 0; font: 700 36px/1.05 var(--f-display); letter-spacing: -.02em; }
#card .sci { margin: -6px 0 0; font-style: italic; font-size: 13px; color: var(--mist-2); }
.measure { display: flex; gap: 26px; }
.measure div { display: grid; }
.measure b { font: 500 32px/1.1 var(--f-num); font-variant-numeric: tabular-nums; }
.measure span { font-size: 12px; color: var(--mist-2); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badges:empty { display: none; }
.badge { border: 1px solid var(--float); color: var(--float); border-radius: 4px; padding: 1px 8px; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
.card-meta { margin: 0; font-size: 12px; line-height: 1.6; color: var(--mist-2); }
.card-actions { display: flex; gap: 8px; }
.card-actions button { flex: 1; padding: 12px 8px; border-radius: 10px; border: 1px solid var(--hair); background: transparent; cursor: pointer; font-weight: 500; }
.card-actions .primary { background: var(--mist); color: #0b1413; border-color: transparent; }
@media (max-aspect-ratio: 1/1) {
  #card { top: auto; transform: none; bottom: max(16px, env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: auto; }
}

#sheet { position: fixed; inset: 0; z-index: 7; display: grid; place-items: end center; background: rgba(4, 8, 8, .45); }
.sheet-panel { width: min(580px, 100%); max-height: min(80vh, 680px); overflow-y: auto; background: var(--glass-hi); border: 1px solid var(--hair);
  border-bottom: 0; border-radius: 16px 16px 0 0; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 18px max(20px, env(safe-area-inset-bottom, 0px)); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0; font: 700 26px/1.1 var(--f-display); }
#sheetBody h3 { margin: 18px 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--mist-2); }
#sheetBody h3 small { font-weight: 400; letter-spacing: 0; margin-left: 6px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opts.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt { text-align: left; border: 1px solid var(--hair); border-radius: 10px; background: rgba(232, 238, 232, .04); padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.opt b { font-size: 15px; }
.opt span { font-size: 12px; color: var(--mist-2); line-height: 1.45; }
.opt[aria-pressed="true"] { border-color: var(--float); background: rgba(255, 91, 46, .1); }
.note { font-size: 12px; color: var(--mist-2); line-height: 1.6; margin: 12px 0 0; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--hair); white-space: nowrap; }
th { font-weight: 500; color: var(--mist-2); font-size: 12px; }
td.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.empty { color: var(--mist-2); font-size: 13px; margin: 8px 0 0; }

@media (max-width: 520px) {
  #action { width: 82px; height: 82px; font-size: 14px; }
  #clock { font-size: 19px; }
}
@media (max-height: 500px) { /* 가로로 든 휴대폰: 세로 공간이 좁다 */
  .side { flex-direction: row; align-items: center; }
  .meter { height: min(24vh, 230px); }
  #action { width: 76px; height: 76px; font-size: 14px; }
  #scope { width: clamp(104px, 28vmin, 300px); }
  #card { top: max(12px, env(safe-area-inset-top, 0px)); transform: none; max-height: calc(100% - 24px); overflow-y: auto; gap: 8px; padding: 14px 16px; }
  #card .card-name { font-size: 28px; }
}
@media (max-aspect-ratio: 4/5) { /* 세로 화면: 조작부가 오른쪽 열을 넓히지 않게 맨 아랫줄 전체를 쓰고, 채비 정보는 상태줄 아래로 */
  #hud { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr auto auto;
    grid-template-areas: "status log" "info info" "scope gauge" "hint hint" "controls controls"; }
  #controls { justify-self: end; }
  #info { align-self: start; max-width: 100%; }
  #info > div { display: inline; }
  #info2:not(:empty)::before { content: " · "; }
}
@media (prefers-reduced-motion: reduce) {
  .mini-float i, .pill.net { animation: none; }
  #hint, #toast { transition: none; }
}
</style>

<canvas id="gl" aria-label="늦가을 저수지 3D 화면"></canvas>

<div id="hud" hidden>
  <div id="status" class="shadowed"><span id="clock" class="num">08:20</span><span id="cond"></span></div>
  <button id="logBtn" class="pill" type="button">조과 <b id="catchCount" class="num">0</b></button>
  <div id="scope" hidden><span class="tag shadowed">찌</span><span id="scopeInfo" class="tag right num shadowed"></span></div>
  <div id="gauge" hidden>
    <span class="g-label">장력</span>
    <div class="meter"><div class="track"><div id="gFill"></div></div><div id="gDrag"></div></div>
    <span id="gText" class="num shadowed">0.00kg</span>
    <span id="gMax" class="num g-label shadowed"></span>
  </div>
  <div id="hint"></div>
  <div id="info" class="num shadowed"><div id="info1"></div><div id="info2"></div></div>
  <div id="controls">
    <div class="side">
      <button id="netBtn" class="pill net" type="button" hidden>뜰채</button>
      <button id="retrieveBtn" class="pill" type="button" hidden>회수</button>
      <button id="tackleBtn" class="pill" type="button">채비</button>
      <div class="drag" role="group" aria-label="드랙 조절">
        <button id="dragDown" type="button" aria-label="드랙 풀기">−</button>
        <span><small>드랙</small><b id="dragVal" class="num">1.2</b></span>
        <button id="dragUp" type="button" aria-label="드랙 조이기">+</button>
      </div>
    </div>
    <button id="action" type="button">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring" cx="50" cy="50" r="46"></circle><circle id="powerArc" class="arc" cx="50" cy="50" r="46"></circle></svg>
      <span id="actionLabel">캐스팅</span>
    </button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<section id="title">
  <div class="title-inner">
    <p class="eyebrow">늦가을 저수지 · 릴찌낚시</p>
    <h1><span>찌올림</span><span class="mini-float" aria-hidden="true"><i></i></span></h1>
    <p class="lede">11월 첫 주, 물안개가 피어오르는 산골 저수지. 수온은 13도, 붕어가 겨울을 앞두고 마지막으로 먹이를 당기는 때입니다. 찌톱이 한 마디씩 솟아오르는 순간을 기다리세요.</p>
    <div class="times" role="group" aria-label="출조 시각">
      <button type="button" data-h="6.67" aria-pressed="false">새벽<span>06:40</span></button>
      <button type="button" data-h="8.33" aria-pressed="true">아침<span>08:20</span></button>
      <button type="button" data-h="13.5" aria-pressed="false">한낮<span>13:30</span></button>
      <button type="button" data-h="16.67" aria-pressed="false">해질녘<span>16:40</span></button>
      <button type="button" data-h="20.5" aria-pressed="false">밤낚시<span>20:30</span></button>
    </div>
    <button id="startBtn" type="button" disabled>저수지를 불러오는 중…</button>
    <p id="keysHelp" class="keys"></p>
    <p id="titleError" class="err" hidden></p>
  </div>
</section>

<section id="card" hidden aria-labelledby="cardName">
  <p class="eyebrow">계측자 위에서</p>
  <h2 id="cardName" class="card-name">붕어</h2>
  <p id="cardSci" class="sci"></p>
  <div class="measure">
    <div><b id="cardLen">0</b><span>cm · 전장</span></div>
    <div><b id="cardW">0</b><span id="cardWUnit">g · 무게</span></div>
  </div>
  <div id="cardBadges" class="badges"></div>
  <p id="cardMeta" class="card-meta"></p>
  <div class="card-actions">
    <button id="releaseBtn" type="button">방생하기</button>
    <button id="keepBtn" type="button" class="primary">살림망에 넣기</button>
  </div>
</section>

<section id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle">채비</h2><button id="sheetClose" class="pill" type="button">닫기</button></div>
    <div id="sheetBody"></div>
  </div>
</section>

<script id="sim">
// 낚시 물리·생태 모델. 화면과 무관한 순수 함수만 둔다 (sim.test.mjs가 이 블록만 떼어 검사한다).
(function (root) {
  'use strict';
  const G = 9.81, KGF = 9.80665, D2R = Math.PI / 180, TAU = Math.PI * 2;
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  // 나일론 '호' → 직선강도(kgf). 1호 ≈ 4lb
  const LINE_KGF = { '1': 1.8, '1.5': 2.7, '2': 3.6, '3': 5.4 };
  const MAIN_LINE = '3';
  const LEADERS = ['1', '1.5', '2'];
  const LEADER_BITE = { '1': 1.2, '1.5': 1, '2': 0.8 }; // 목줄이 가늘수록 고기가 덜 경계한다
  const BAITS = {
    paste: { name: '떡밥', note: '붕어·잉어·향어. 같은 자리에 던질수록 고기가 모인다' },
    worm: { name: '지렁이', note: '거의 모든 어종. 블루길·동자개 성화가 잦다' },
    corn: { name: '옥수수', note: '잉어와 큰 붕어. 잔챙이가 덜 붙는다' },
    shrimp: { name: '새우', note: '대물 붕어·배스·메기·강준치' },
  };
  const BAIT_SIZE = { paste: 1, worm: 0.95, corn: 1.12, shrimp: 1.1 };

  // a·b: 전장(cm)-무게(g) 관계 W = a·L^b, mu·sigma: 전장 로그정규 분포, act: 시간대별 활성
  const SPECIES = {
    crucian: { name: '붕어', sci: 'Carassius auratus', a: 0.0187, b: 3.03, len: [9, 45], mu: 19, sigma: 0.22, abundance: 1,

  const weight = (sp, len) => sp.a * Math.pow(len, sp.b);

  function gauss(rnd) { let u = 0; while (u === 0) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * rnd()); }

  function sampleLength(sp, bait, rnd) {
    const mu = sp.mu * (BAIT_SIZE[bait] || 1);
    const sigma = sp.sigma * (rnd() < 0.04 ? 1.9 : 1); // 드물게 대물 꼬리
    for (let i = 0; i < 30; i++) {
      const L = mu * Math.exp(sigma * gauss(rnd));
      if (L >= sp.len[0] && L <= sp.len[1]) return Math.round(L * 10) / 10;
    }
    return sp.mu;
  }

  // 11월 8일, 북위 37.5°·동경 127° 기준. KST 시각 → 태양 고도·방위(북에서 시계방향, 라디안)
  const LAT = 37.5 * D2R, DEC = -16.4 * D2R, NOON = 12.27;
  function sun(hour) {
    const H = (hour - NOON) * 15 * D2R;
    const el = Math.asin(Math.sin(LAT) * Math.sin(DEC) + Math.cos(LAT) * Math.cos(DEC) * Math.cos(H));
    const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(LAT) - Math.tan(DEC) * Math.cos(LAT)) + Math.PI;
    return { el, az };
  }
  const HALF_DAY = Math.acos(-Math.tan(LAT) * Math.tan(DEC)) / D2R / 15;
  const SUNRISE = NOON - HALF_DAY, SUNSET = NOON + HALF_DAY;
  const airTemp = (h) => 9 + 6 * Math.cos((h - 14.5) / 24 * TAU);
  const waterTemp = (h) => 13.2 + 0.6 * Math.cos((h - 16) / 24 * TAU);

  function activity(sp, hour) {
    const day = smooth(-4, 8, sun(hour).el / D2R);
    const dawn = Math.exp(-0.5 * Math.pow((hour - SUNRISE - 0.7) / 0.9, 2));
    const dusk = Math.exp(-0.5 * Math.pow((hour - SUNSET + 0.2) / 0.9, 2));
    return Math.max(lerp(sp.act.night, sp.act.day, day), sp.act.dawn * dawn, sp.act.dusk * dusk);
  }
  function depthPref(sp, d) {
    const e = d < sp.depth[0] ? sp.depth[0] - d : d > sp.depth[1] ? d - sp.depth[1] : 0;
    return Math.exp(-Math.pow(e / 0.9, 2));
  }
  // o: { bait, hour, depth, chum(집어 0~4), leader }
  function biteWeights(o) {
    const list = []; let total = 0;
    for (const id in SPECIES) {
      const sp = SPECIES[id];
      const w = sp.abundance * (sp.bait[o.bait] || 0) * activity(sp, o.hour) * depthPref(sp, o.depth) * (1 + (o.chum || 0) * (sp.bait.paste || 0) * 0.5);
      list.push([id, w]); total += w;
    }
    return { list, total };
  }
  const BITE_BASE = 1 / 50; // 초당 접근률 (가중치 합 1 기준)
  const biteRate = (o) => BITE_BASE * biteWeights(o).total * (LEADER_BITE[o.leader] || 1);
  function pickSpecies(o, rnd) {
    const { list, total } = biteWeights(o);
    let r = rnd() * total;
    for (const [id, w] of list) if ((r -= w) <= 0) return id;
    return list[0][0];
  }

  // 입질 각본: keys = [시각 s, 찌 움직임(마디, +솟음 −잠김)], win = 챔질이 먹히는 구간, best = 최적 시각
  function makeBite(sp, len, rnd) {
    const keys = [[0, 0]];
    let t = 0.4 + rnd() * 1.5;
    keys.push([t, 0]);
    const add = (dt, v) => { t += dt; keys.push([t, v]); };
    const big = Math.sqrt(len / sp.mu);
    const nibbles = (n, amp, dur) => {
      for (let i = 0; i < n; i++) { add(0.7 + rnd() * 3.2, 0); add(dur, (rnd() < 0.3 ? 0.6 : -1) * amp * (0.6 + rnd() * 0.8)); add(dur * 1.4, 0); }
    };
    let win, best, drift = null, steal;
    switch (sp.bite) {
      case 'rise': { // 붕어: 예신 몇 번 뒤 찌가 천천히 솟는다. 큰 놈일수록 느리고 묵직하다
        nibbles(1 + Math.floor(rnd() * 3), 0.5, 0.13);
        add(1 + rnd() * 2.2, 0);
        const t0 = t, rise = (1.1 + rnd() * 1.2) * big, h = (2 + rnd() * 2.3) * Math.min(1.4, big);
        add(rise * 0.45, h * 0.6); add(rise * 0.55, h);
        const top = t; add(0.5 + rnd() * 1.4, h * 0.96);
        win = [t0 + rise * 0.35, t + 0.3]; best = top;
        if (rnd() < 0.55) add(1, 0); else { add(0.5, h * 0.4); add(0.6, -1.5); add(0.8, 0); }
        steal = 0.35; break;
      }
      case 'sink': { // 배스·강준치: 한 번에 쭉 빨고 들어간다
        nibbles(Math.floor(rnd() * 2), 0.6, 0.1);
        add(0.6 + rnd() * 2, 0);
        const t0 = t; add(0.16, -2.5); add(0.22, -8);
        drift = { t0: t0 + 0.15, t1: t0 + 2.8, speed: 0.6 + rnd() * 0.7, ang: 0 };
        win = [t0 + 0.08, t0 + 2.3]; best = t0 + 0.6;
        add(2.4, -8); add(0.7, 0); steal = 0.5; break;
      }
      case 'drag': { // 잉어·향어: 끄덕이다가 묵직하게 끌고 들어간다
        nibbles(2 + Math.floor(rnd() * 3), 0.7, 0.3);
        add(1 + rnd() * 2, 0);
        const t0 = t; add(0.7, -1.2); add(1, -8);
        drift = { t0: t0 + 0.8, t1: t0 + 5, speed: 0.3 + rnd() * 0.3, ang: 0 };
        win = [t0 + 0.8, t0 + 4.8]; best = t0 + 1.9;
        add(3.5, -8); add(1, 0); steal = 0.3; break;
      }
      case 'jitter': { // 블루길: 쉴 새 없이 쪼다가 미끼만 따 간다
        for (let i = 0, n = 5 + Math.floor(rnd() * 8); i < n; i++) { add(0.25 + rnd() * 0.6, 0); add(0.09, -(0.5 + rnd())); add(0.12, 0); }
        const t0 = t; add(0.12, -3); add(0.35, -3);
        win = [t0, t0 + 0.55]; best = t0 + 0.15;
        add(0.3, 0); steal = 0.8; break;
      }
      case 'heavy': { // 메기: 천천히 무겁게 잠긴다
        nibbles(1 + Math.floor(rnd() * 2), 0.8, 0.35);
        add(1.5 + rnd() * 2, 0);
        const t0 = t; add(1.2, -8);
        drift = { t0: t0 + 0.6, t1: t0 + 5.5, speed: 0.35 + rnd() * 0.2, ang: 0 };
        win = [t0 + 0.5, t0 + 5.2]; best = t0 + 1.8;
        add(4.5, -8); add(1, 0); steal = 0.45; break;
      }
      default: { // 동자개: 잔입질 끝에 쑥 가져간다
        for (let i = 0, n = 3 + Math.floor(rnd() * 4); i < n; i++) { add(0.4 + rnd() * 0.9, 0); add(0.1, -(0.6 + rnd() * 0.8)); add(0.15, 0); }
        add(0.5 + rnd(), 0);
        const t0 = t; add(0.45, -8);
        drift = { t0: t0 + 0.3, t1: t0 + 3.2, speed: 0.3 + rnd() * 0.2, ang: 0 };
        win = [t0 + 0.25, t0 + 3.2]; best = t0 + 1;
        add(3, -8); add(0.8, 0); steal = 0.6;
      }
    }
    return { keys, win, best, drift, end: t, steal, type: sp.bite };
  }

  function sampleKeys(keys, t) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) {
        const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
        const u = (t - t0) / Math.max(1e-6, t1 - t0);
        return v0 + (v1 - v0) * u * u * (3 - 2 * u);
      }
    }
    return keys[keys.length - 1][1];
  }

  function strike(bite, t, sp, rnd) {
    if (t < bite.win[0] || t > bite.win[1]) return { hooked: false, q: 0, early: t < bite.win[0] };
    const span = Math.max(bite.best - bite.win[0], bite.win[1] - bite.best, 1e-3);
    const q = clamp(1 - Math.abs(t - bite.best) / span, 0, 1);
    return { hooked: rnd() < sp.hook * (0.35 + 0.65 * q), q, early: false };
  }

  // ---- 챔질 후 파이팅 ----
  const RETRIEVE = 0.8; // m/s: 기어비 5.2:1 스피닝릴, 핸들 1회전/초
  const ROD_K = 11;     // N/m: 낚싯대 휨 탄성
  const SPOOL = 150;    // m: 스풀에 감긴 원줄
  const THRUST = { run: 1, turn: 0.75, shake: 0.45, dive: 0.65, rest: 0.12, tired: 0.1, jump: 0 };

  function newFight(sp, len, x, z, depth, q, rnd) {
    const mass = weight(sp, len) / 1000;
    const energy = sp.stamina * 22 * Math.pow(mass, 0.12);
    return { sp, len, mass, q, x, z, y: -Math.max(0.3, depth) * 0.9, vx: 0, vz: 0, vy: 0, heading: 0,
      mode: 'run', modeT: 1.5 + rnd() * 2, stamina: 1, energy, energy0: energy,
      vmax: sp.speed * Math.min(1.6, Math.sqrt(len / sp.mu)) * (0.85 + 0.3 * rnd()),
      L: 0, T: 0, peak: 0, slip: 0, slackT: 0, snagT: 0, air: false, t: 0, result: null, jumped: false, splash: false };
  }

  function nearestCover(f, covers) {
    let best = null;
    for (const c of covers || []) {
      const d = Math.hypot(c.x - f.x, c.z - f.z);
      if (!best || d < best.d) best = { x: c.x, z: c.z, r: c.r, d };
    }
    return best;
  }

  function pickMode(f, rnd) {
    const sp = f.sp, s = f.stamina;
    if (s < 0.16) return ['tired', 1.5 + rnd() * 2];
    const opts = [['run', 0.25 + 0.35 * s, 2 + rnd() * 3], ['turn', 0.22, 1.5 + rnd() * 2], ['shake', 0.08 + sp.shake * 0.25, 0.8 + rnd() * 1.2],
      ['dive', 0.05 + sp.dive * 0.22, 1.5 + rnd() * 2.5], ['rest', 0.12 + (1 - s) * 0.35, 0.8 + rnd() * 1.8],
      ['jump', s > 0.3 && f.y > -2.5 ? sp.jump * 0.22 : 0, 0.1]];
    let tot = 0; for (const o of opts) tot += o[1];
    let r = rnd() * tot;
    for (const o of opts) if ((r -= o[1]) <= 0) return [o[0], o[2]];
    return ['rest', 1];
  }

  // c: { tipX, tipY, tipZ, reel(0~1), drag·leaderN·mainN (N), side(−1~1), depthAt(x,z), covers, minL }
  function fightStep(f, c, dt, rnd) {
    if (f.result) return f;
    const sp = f.sp; f.t += dt;
    f.modeT -= dt;
    if (f.modeT <= 0 && !f.air) {
      const [m, d] = pickMode(f, rnd);
      f.mode = m; f.modeT = d;
      const away = Math.atan2(f.x - c.tipX, f.z - c.tipZ);
      if (m === 'run') {
        f.heading = away + (rnd() - 0.5) * 1.6;
        const cv = nearestCover(f, c.covers);
        if (cv && cv.d < 30 && rnd() < sp.cover * 0.6) f.heading = Math.atan2(cv.x - f.x, cv.z - f.z); // 수초로 파고든다
      } else if (m === 'turn') f.heading = away + (rnd() < 0.5 ? -1 : 1) * (1.2 + rnd() * 0.6);
      else if (m === 'rest' || m === 'tired') f.heading = away + (rnd() - 0.5) * 2;
      else if (m === 'jump') { f.air = true; f.vy = 2.6 + rnd() * 1.6; f.y = Math.max(f.y, -0.05); f.jumped = true; }
    }
    const full = sp.power * f.mass * G;
    let thrust = full * (0.3 + 0.7 * f.stamina) * THRUST[f.mode];
    if (f.mode === 'shake') { thrust *= 0.5 + 0.5 * Math.sin(f.t * 22); f.heading += (rnd() - 0.5) * 0.5; }
    let dx = c.tipX - f.x, dy = c.tipY - f.y, dz = c.tipZ - f.z;
    let D = Math.hypot(dx, dy, dz) || 1e-6;
    const ux = dx / D, uy = dy / D, uz = dz / D;
    const T0 = f.T, m = f.mass * 1.3; // 부가질량 포함
    const cd = full / (f.vmax * f.vmax);
    const side = (c.side || 0) * 0.5 * T0; // 낚싯대를 옆으로 눕히면 고기 머리가 그쪽으로 돈다
    let fx = Math.sin(f.heading) * thrust + ux * T0 + uz * side;
    let fz = Math.cos(f.heading) * thrust + uz * T0 - ux * side;
    const v = Math.hypot(f.vx, f.vz);
    fx -= cd * v * f.vx; fz -= cd * v * f.vz;
    f.vx += fx / m * dt; f.vz += fz / m * dt;
    const bottom = -Math.max(0.3, c.depthAt(f.x, f.z));
    if (f.air) {
      f.vy -= G * dt; f.y += f.vy * dt;
      if (f.y < 0 && f.vy < 0) { f.air = false; f.splash = true; f.y = -0.3; f.vy = 0; f.mode = 'rest'; f.modeT = 0.5; }
    } else {
      const ty = f.mode === 'dive' ? bottom + 0.2 : f.mode === 'tired' ? -0.04 : f.mode === 'rest' ? f.y : lerp(bottom, -0.3, 0.4);
      const lift = Math.max(0, T0 * uy) / (f.mass * G); // 줄이 위로 끌면 떠오른다
      f.vy = (ty - f.y) * 0.8 + lift * 0.5;
      f.y = clamp(f.y + f.vy * dt, bottom, -0.02);
    }
    let nx = f.x + f.vx * dt, nz = f.z + f.vz * dt;
    if (c.depthAt(nx, nz) < 0.35) { f.vx *= -0.3; f.vz *= -0.3; f.heading += Math.PI * 0.7; nx = f.x; nz = f.z; }
    f.x = nx; f.z = nz;
    // 장력: 원줄 신장(파단 시 약 25%)과 낚싯대 휨을 직렬 스프링으로 본다
    dx = c.tipX - f.x; dy = c.tipY - f.y; dz = c.tipZ - f.z;
    D = Math.hypot(dx, dy, dz);
    if (c.reel > 0 && T0 < c.drag * 0.97) f.L = Math.max(c.minL || 1, f.L - c.reel * RETRIEVE * dt);
    const k = 1 / (1 / (4 * c.mainN / Math.max(1, f.L)) + 1 / ROD_K);
    let T = Math.max(0, (D - f.L) * k);
    const slipAt = f.slip > 0 ? c.drag : c.drag * 1.12; // 드랙은 처음 풀릴 때 저항이 더 크다
    const peak = Math.min(T, slipAt);
    if (T > slipAt) { const s = (T - c.drag) / k; f.L += s; f.slip = s / dt; T = c.drag; } else f.slip = 0;
    f.peak = Math.max(f.peak, peak);
    if (peak > c.leaderN) f.result = 'broken';
    else if (f.L > SPOOL) f.result = 'spooled';
    f.T = T;
    // 바늘털이: 줄이 늘어진 채 머리를 흔들거나 뛰어오르면 빠진다
    f.slackT = T < 0.25 ? f.slackT + dt : 0;
    let hz = 0.004 * (1.5 - f.q);
    if (f.slackT > 1.2 && (f.mode === 'shake' || f.air)) hz += 0.6;
    if (f.slackT > 3) hz += 0.25;
    if (f.air && T < 1.5) hz += 0.6;
    if (!f.result && rnd() < hz * dt) f.result = 'unhooked';
    // 수초 걸림: 수초 안에서 장력을 못 주면 감긴다
    const cv = nearestCover(f, c.covers);
    if (cv && cv.d < cv.r) f.snagT = Math.max(0, f.snagT + dt * (T > c.drag * 0.55 ? -0.8 : 1));
    else f.snagT = Math.max(0, f.snagT - dt);
    if (!f.result && f.snagT > 3) f.result = 'snagged';
    // 체력: 힘을 쓸수록, 장력을 버틸수록 지친다
    f.energy -= (thrust / full) * (1 + 0.8 * T / (f.mass * G)) * dt;
    if (f.mode === 'rest' && T < f.mass * G * 0.3) f.energy += 0.35 * dt;
    f.energy = Math.min(f.energy, f.energy0);
    f.stamina = clamp(f.energy / f.energy0, 0, 1);
    return f;
  }

  // 낚싯대 휨: 끝에 장력 T(N)가 축과 각도 alpha로 걸릴 때의 2D 곡선 (x = 축 방향, y = 줄 쪽). 끝으로 갈수록 가늘어 잘 휜다.
  let scratch = null;
  function rodBend(T, alpha, len, n, EI0, out) {
    const ds = len / n, ux = Math.cos(alpha), uy = Math.sin(alpha);
    const a = out || new Float32Array((n + 1) * 2);

// ================= 동작: 캐스팅 → 정렬 → 입질 → 챔질 → 파이팅 → 뜰채 =================

  for (let i = 0; i < 3000 && y > 0; i++) { const sp = Math.hypot(vx, vy), dt = 1 / 120; vx -= CAST_K * sp * vx * dt; vy -= (9.81 + CAST_K * sp * vy) * dt; x += vx * dt; y += vy * dt; }

}
function startCast() {
  const p = game.power, dist = 6 + 36 * Math.pow(p, 1.15);

  for (let i = 0; i < 22; i++) { const v = (lo + hi) / 2; if (castRange(v, rodTip.y) < dist) lo = v; else hi = v; }
  const v0 = (lo + hi) / 2, yaw = rig.rotation.y + (rnd() - 0.5) * 0.07 * p;
  game.flight = { p: rodTip.clone(), v: new THREE.Vector3(-Math.sin(yaw) * v0 * Math.cos(0.56), v0 * Math.sin(0.56), -Math.cos(yaw) * v0 * Math.cos(0.56)) };

function flightStep(dt) {
  const f = game.flight, n = 4, h = dt / n;
  for (let i = 0; i < n; i++) {
    const v = f.v, sp = v.length();
    v.x += (-CAST_K * sp * v.x + wind.x * 0.25) * h; v.z += (-CAST_K * sp * v.z + wind.z * 0.25) * h; v.y += (-9.81 - CAST_K * sp * v.y) * h;

  }
  game.L = f.p.distanceTo(rodTip) * 1.03 + 0.3;

  if (f.p.y <= Math.max(0, ground)) land(f.p.x, f.p.z, ground);
}
function land(x, z, ground) {
  const F = game.fl;
  F.x = x; F.z = z; F.dist = Math.hypot(x - PLAYER.x, z - PLAYER.z);
  if (ground > -0.2) { toast('찌가 물가 풀숲에 떨어졌습니다. 채비를 거둡니다.'); F.depth = 0.2; F.e = 0.02; F.tilt = 1.4; game.phase = 'retrieving'; return; }
  F.e = 0.012; F.ev = 0; F.tilt = 1.45; F.depth = -ground; F.settle = 0; F.settleDur = F.depth / 0.42 + 0.9;
  game.L = Math.hypot(x - rodTip.x, rodTip.y, z - rodTip.z) + 0.35; // 여유줄은 감아 둔다
  spawnRipple(x, z, 0.45, 0.55); spawnRipple(x, z, 0.25, 0.35, 0.3); splashBurst(x, 0, z, 10, 0.8);
  audio.plop(F.dist);

function chumAt(x, z) { // 떡밥 집어: 같은 자리에 던질수록 쌓이고 10분쯤이면 흩어진다

  for (const k of game.chum) c += Math.exp(-(clockT - k.t) / 600) * Math.exp(-Math.pow(Math.hypot(k.x - x, k.z - z) / 3.5, 2));

function biteCtx() { return { bait: game.bait, hour: game.clock, depth: game.fl.depth, chum: chumAt(game.fl.x, game.fl.z), leader: game.leader }; }

      if (game.flags.bite) setHint('찌톱을 지켜보세요. 천천히 솟거나 쑥 빨려 들어가면 챔질!');

const LOST = { broken: '목줄이 터졌습니다', unhooked: '바늘이 빠졌습니다', snagged: '수초에 감겨 목줄이 끊어졌습니다', spooled: '원줄이 다 풀려 끊어졌습니다' };
function fightStepGame(dt) {

  update(dt);
  render();
  if ((hudAcc += dt) > 0.1) { hudAcc = 0; if (game.phase !== 'title') hudTick(); }
  // 느린 기기는 해상도를 낮춘다
  frameMs += ((now - (frame.prev || now)) - frameMs) * 0.05; frame.prev = now;
  if (frameMs > 26) { slowT += dt; fastT = 0; } else if (frameMs < 15) { fastT += dt; slowT = 0; } else { slowT = fastT = 0; }
  if (slowT > 2 && pixelRatio > 0.75) { pixelRatio = Math.max(0.75, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); resize(); slowT = 0; }
  if (fastT > 5 && pixelRatio < maxRatio) { pixelRatio = Math.min(maxRatio, pixelRatio + 0.25); renderer.setPixelRatio(pixelRatio); resize(); fastT = 0; }
}

// ================= 시작 =================
function start(data) {
  if (data && typeof data.clock === 'number') game.clock = data.clock;
  buildTerrain(); buildTrees(); buildReeds(); buildCovers(); buildMist();
  resize();
  envTick(true);
  for (let i = 0; i < 30; i++) { dangle(1 / 60); updateRod(0.12, dang.p, game.rodElev); }
  requestAnimationFrame(frame);
  window.__jjiolimReady = true;
  window.__jjiolim = { game, env, step: (s) => { for (let t = 0; t < s; t += 1 / 30) update(1 / 30); } }; // 자동 점검용: 렌더 없이 시간 진행
  const btn = $('startBtn');
  btn.disabled = false; btn.textContent = '낚시 시작';
  $('keysHelp').textContent = isTouch
    ? '화면 끌기: 시선 · 큰 버튼: 던지기(길게) · 챔질 · 릴 감기(누르고 있기)'
    : '마우스 끌기: 시선 · 스페이스: 던지기(길게) · 챔질 · 릴 감기 · Q/E: 드랙 · R: 회수 · F: 뜰채';
  for (const b of document.querySelectorAll('.times button')) {
    b.addEventListener('click', () => {
      for (const o of document.querySelectorAll('.times button')) o.setAttribute('aria-pressed', String(o === b));
      game.clock = Number(b.dataset.h); envTick(true);
    });
  }
  btn.addEventListener('click', () => {
    audio.init();
    $('title').hidden = true; $('hud').hidden = false;
    game.phase = 'idle'; setHint(idleHint());
    btn.blur(); resize(); hudTick();
  });
}
window.claude?.hot?.snapshot?.(() => ({ clock: game.clock }));
try {
  if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
} catch (err) {
  console.error(err);
  fail('저수지를 그리는 중 문제가 생겼습니다: ' + err.message);
}
</script>
