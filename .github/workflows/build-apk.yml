name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check the chat renderer
        run: node --test app/src/test/js/markdown.test.mjs

      # One fixed signing key for every build, so a new APK installs over the old one and the saved chats survive.
      # Without the DEBUG_KEYSTORE_B64 secret, Gradle makes a new random key on this fresh machine.
      - name: Restore the signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; else echo "::warning::DEBUG_KEYSTORE_B64 is not set: this APK cannot update an installed one"; fi

      - name: Build installable APK
        run: |
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk AsterAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AsterAI-Android
          path: AsterAI.apk
