<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poolrooms</title>
<style>
  :root { --ink: #d4eeea; --dim: #86a9a5; --bg: #040909; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  canvas { display: block; }
  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 0 16px; text-align: center; cursor: pointer; user-select: none;
    background: radial-gradient(ellipse at center, rgba(4, 20, 20, .62), rgba(0, 0, 0, .9)); }
  #overlay h1 { margin: 0 0 4px .45em; font-weight: 300; letter-spacing: .45em; font-size: clamp(30px, 7vw, 60px);
    color: #effffc; text-shadow: 0 0 28px rgba(110, 255, 225, .35); }
  #go { font-size: 17px; letter-spacing: .18em; color: #fff; animation: pulse 2.6s ease-in-out infinite; }
  .keys { font-size: 13px; line-height: 2; color: var(--dim); max-width: 520px; }
  .keys b { display: inline-block; min-width: 14px; padding: 0 5px; margin: 0 2px; border: 1px solid #3c5554;
    border-radius: 3px; color: var(--ink); font-weight: 600; line-height: 1.5; }
  .err { color: #ff9d8c; font-size: 14px; max-width: 560px; line-height: 1.6; white-space: pre-wrap; }
  @keyframes pulse { 50% { opacity: .35; } }
  #cross { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%;
    background: rgba(255, 255, 255, .85); box-shadow: 0 0 0 1px rgba(0, 0, 0, .45); pointer-events: none; z-index: 5; display: none; }
  #hint { position: fixed; left: 50%; top: calc(50% + 36px); transform: translateX(-50%); font-size: 13px;
    letter-spacing: .08em; color: #eafffb; text-shadow: 0 0 6px #000, 0 0 2px #000; pointer-events: none; z-index: 5; white-space: nowrap; }
</style>
</head>
<body>
<div id="overlay">
  <h1>POOLROOMS</h1>
  <div id="go">불러오는 중…</div>
  <div class="keys"><b>W</b><b>A</b><b>S</b><b>D</b> 이동 · 마우스 시점 · <b>Shift</b> 조금 빠르게<br><b>E</b> 또는 클릭: 엘리베이터 버튼 / 모니터 · <b>Esc</b> 일시정지</div>
  <div class="err" id="err"></div>
</div>
<div id="cross"></div>
<div id="hint"></div>
<script>
  // Shown when the CDN module never starts (offline / blocked) or throws before the module's own handler exists.
  window.addEventListener('error', (e) => { const el = document.getElementById('err'); if (el && !window.__ready) el.textContent = '오류: ' + (e.message || e); });
  setTimeout(() => { if (!window.__loaded) document.getElementById('err').textContent = 'three.js를 CDN에서 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'; }, 20000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

window.__loaded = true;
const $ = (id) => document.getElementById(id);

// ============================================================ constants
const SPACING = 20;          // vertical distance between floors (P,1,2,3 stacked on one shaft)
const CELL = 0.25;           // plan grid resolution (m)
const EYE = 1.62, RADIUS = 0.28, STEP = 0.45;
const PLAN = { x0: -40, z0: -10, size: 80 };
const GN = Math.round(PLAN.size / CELL);
const MAX_WIN = 10;
const LABELS = ['P', '1', '2', '3'];
const base = (i) => i * SPACING;
const WHITE = [1, 1, 1], COPING = [0.32, 0.66, 0.66], NAVY = [0.04, 0.1, 0.22];

function rng(seed) {
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const mtx = (x, y, z, ry = 0, rx = 0, rz = 0) =>
  new THREE.Matrix4().compose(V3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz, 'YXZ')), V3(1, 1, 1));

// ============================================================ renderer / scene
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.75;
document.body.prepend(renderer.domElement);

const FOG = new THREE.Color(0x040b0b);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG, 0.035);
scene.environmentIntensity = 0.4;
renderer.setClearColor(FOG);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 140);
camera.rotation.order = 'YXZ';
const mirrorCam = new THREE.PerspectiveCamera();

// uniforms shared by every custom shader (same objects, so one update reaches all materials)
const U = {
  uTime: { value: 0 },
  uWaterY: { value: 0 }, uDeckY: { value: 0 }, uPlanar: { value: 1 }, uCausticK: { value: 1 },
  uMask: { value: null }, uMaskXf: { value: new THREE.Vector4(PLAN.x0, PLAN.z0, 1 / PLAN.size, 0) },
  uAtlasOff: { value: new THREE.Vector2() },
  uReflTex: { value: null }, uReflMat: { value: new THREE.Matrix4() },
  uWinCount: { value: 0 },
  uWinO: { value: Array.from({ length: MAX_WIN }, () => new THREE.Vector4()) },
  uWinM: { value: Array.from({ length: MAX_WIN }, () => new THREE.Matrix3()) },
  uWinD: { value: Array.from({ length: MAX_WIN }, () => V3(0, -1, 0)) },
  uWinCol: { value: new THREE.Color(1.0, 0.6, 0.31).multiplyScalar(1.15) },
  uSceneCol: { value: null }, uSceneDepth: { value: null },
  uRes: { value: new THREE.Vector2(1, 1) }, uNear: { value: camera.near }, uFar: { value: camera.far },
  uCamFwd: { value: V3(0, 0, -1) },
};
const DUMMY = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1);
DUMMY.needsUpdate = true;

// ============================================================ GLSL
const G_HASH = /* glsl */`
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float noise3(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash13(i), hash13(i + vec3(1,0,0)), f.x), mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x), mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y), f.z);
}
vec3 noised(vec2 x){
  vec2 i = floor(x), f = fract(x);
  vec2 u = f * f * (3.0 - 2.0 * f), du = 6.0 * f * (1.0 - f);
  float a = hash12(i), b = hash12(i + vec2(1.0, 0.0)), c = hash12(i + vec2(0.0, 1.0)), d = hash12(i + vec2(1.0, 1.0));
  return vec3(a + (b - a) * u.x + (c - a) * u.y + (a - b - c + d) * u.x * u.y, du * (vec2(b - a, c - a) + (a - b - c + d) * u.yx));
}
`;
// arched window silhouette with mullions; uv in [0,1]^2, asp = height / width
const G_ARCH = /* glsl */`
float archMask(vec2 uv, float asp, float soft, float bars){
  float X = uv.x - 0.5, Y = uv.y * asp, yc = asp - 0.5;
  float sd = Y > yc ? length(vec2(X, Y - yc)) - 0.5 : abs(X) - 0.5;
  sd = max(sd, -Y);
  float m = 1.0 - smoothstep(-soft, soft, sd);
  if (bars > 0.0 && m > 0.0) {
    float bw = 0.017, s2 = soft + 0.004;
    float b = smoothstep(bw, bw + s2, abs(X));
    b *= smoothstep(bw, bw + s2, abs(Y - yc / 3.0)) * smoothstep(bw, bw + s2, abs(Y - yc * 2.0 / 3.0)) * smoothstep(bw, bw + s2, abs(Y - yc));
    if (Y > yc) {
      vec2 q = vec2(X, Y - yc);
      b *= smoothstep(bw, bw + s2, abs(dot(q, vec2(0.7071, -0.7071)))) * smoothstep(bw, bw + s2, abs(dot(q, vec2(0.7071))));
      b *= smoothstep(bw, bw + s2, abs(length(q) - 0.24));
    }
    m *= mix(1.0, b, bars);
  }
  return m;
}
`;
// warm light falling through every window of the current floor (parallel beams, soft with distance)
const G_WIN = /* glsl */`
#define MAX_WIN ${MAX_WIN}
uniform int uWinCount;
uniform vec4 uWinO[MAX_WIN];
uniform mat3 uWinM[MAX_WIN];
uniform vec3 uWinD[MAX_WIN];
uniform vec3 uWinCol;
vec3 windowLight(vec3 p, vec3 n){
  vec3 acc = vec3(0.0);
  for (int i = 0; i < MAX_WIN; i++) {
    if (i >= uWinCount) break;
    vec3 q = uWinM[i] * (p - uWinO[i].xyz);
    if (q.z > 0.0 && q.z < 1.0 && q.x > -0.1 && q.x < 1.1 && q.y > -0.1 && q.y < 1.1) {
      float ndl = max(dot(n, -uWinD[i]), 0.0);
      if (ndl > 0.0) acc += archMask(q.xy, uWinO[i].w, 0.01 + q.z * 0.05, 1.0) * ndl * (1.0 - q.z);
    }
  }
  return acc * uWinCol;
}
`;
// procedural caustics: two animated Voronoi edge layers (bright where light focuses)
const G_CAUSTIC = /* glsl */`
float voroEdge(vec2 p, float t){
  vec2 n = floor(p), f = fract(p);
  float d1 = 8.0, d2 = 8.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j));
    vec2 o = 0.5 + 0.42 * sin(t + 6.2831 * hash22(n + g));
    float d = length(g + o - f);
    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
  }
  return d2 - d1;
}
float caustic(vec2 p, float t, float w){
  p += 0.12 * sin(p.yx * 1.7 + t * 0.6);
  float a = 1.0 - smoothstep(0.0, 0.17 * w, voroEdge(p, t));
  float b = 1.0 - smoothstep(0.0, 0.21 * w, voroEdge(p * 1.6 + 3.7, t * 1.3 + 2.0));
  return a * a * 0.9 + b * b * 0.55;
}
`;

// ---- tile material: procedural glossy tiles, grout, bevels, caustics, window light, planar wet reflection
const TILE_PARS = /* glsl */`
uniform float uTime;
uniform float uWaterY, uDeckY, uPlanar, uCausticK;
uniform sampler2D uMask;
uniform sampler2D uReflTex;
uniform vec4 uMaskXf;
uniform vec2 uAtlasOff;
uniform mat4 uReflMat;
varying vec3 vWPos;
varying vec3 vWNrm;
${G_HASH}${G_ARCH}${G_WIN}${G_CAUSTIC}
vec4 planMask(vec2 xz){ vec2 uv = clamp((xz - uMaskXf.xy) * uMaskXf.z, 0.003, 0.997); return texture2D(uMask, uAtlasOff + uv * 0.5); }
`;
const TILE_COLOR = /* glsl */`
vec3 wN = normalize(vWNrm);
vec3 aN = abs(wN);
float hRel = vWPos.y - uDeckY;
bool tFloor = wN.y > 0.6;
bool tCeil = wN.y < -0.6;
bool tPool = hRel < -0.03;
vec2 tuv; vec3 tT; vec3 tB;
if (aN.y > 0.6) { tuv = vWPos.xz; tT = vec3(1.0, 0.0, 0.0); tB = vec3(0.0, 0.0, 1.0); }
else if (aN.x > aN.z) { tuv = vec2(vWPos.z, hRel); tT = vec3(0.0, 0.0, 1.0); tB = vec3(0.0, 1.0, 0.0); }
else { tuv = vec2(vWPos.x, hRel); tT = vec3(1.0, 0.0, 0.0); tB = vec3(0.0, 1.0, 0.0); }
float tsz = tPool ? 0.125 : (tFloor ? 0.25 : (tCeil ? 0.3 : 0.15));
vec2 tc = tuv / tsz;
vec2 tid = floor(tc);
vec2 tf = fract(tc);
vec2 tfw = fwidth(tc);
float tpx = length(fwidth(vWPos));
float tfar = clamp(max(tfw.x, tfw.y) * 2.5 - 0.5, 0.0, 1.0);
vec2 ted = min(tf, 1.0 - tf);
const float GW = 0.05;
vec2 tg = smoothstep(vec2(GW) - tfw, vec2(GW) + tfw, ted);
float tMask = mix(tg.x * tg.y, 0.82, tfar);
float trnd = hash12(tid + (tPool ? 17.0 : 0.0) + (tCeil ? 41.0 : 0.0));
vec3 tcol = diffuseColor.rgb;
if (min(tcol.r, min(tcol.g, tcol.b)) > 0.985) {
  if (tPool) tcol = mix(vec3(0.2, 0.62, 0.63), vec3(0.06, 0.33, 0.4), smoothstep(0.3, 4.0, -hRel));
  else if (tCeil) tcol = vec3(0.78, 0.82, 0.81);
  else if (tFloor) tcol = vec3(0.85, 0.88, 0.87);
  else {
    tcol = vec3(0.9, 0.93, 0.92);
    if (tid.y < 0.5 || abs(tid.y - 7.0) < 0.5) tcol = vec3(0.12, 0.5, 0.52);
    else if (abs(tid.y - 8.0) < 0.5) tcol = vec3(0.05, 0.26, 0.29);
  }
}
tcol *= 0.92 + 0.14 * trnd;
vec3 tgrout = tPool ? vec3(0.13, 0.32, 0.34) : vec3(0.45, 0.48, 0.47);
diffuseColor.rgb = mix(tgrout, tcol, tMask);
float tRough = mix(0.72, ((tFloor && !tPool) ? 0.05 : 0.09) + 0.12 * trnd, tMask);
`;
const TILE_NORMAL = /* glsl */`
vec2 tdir = sign(tf - 0.5);
vec2 tbev = 1.0 - smoothstep(vec2(GW), vec2(GW + 0.11), ted);
vec2 ttilt = (tbev * tdir * 0.42 * tg.x * tg.y + (hash22(tid + 3.7) - 0.5) * 0.05) * (1.0 - tfar);
vec3 tnW = normalize(wN + tT * ttilt.x + tB * ttilt.y);
normal = normalize((viewMatrix * vec4(tnW, 0.0)).xyz);
`;
const TILE_EMIT = /* glsl */`
vec4 tpm = planMask(vWPos.xz);
float tcaus = 0.0;
if (vWPos.y < uWaterY && tpm.r > 0.4) {
  float d = uWaterY - vWPos.y;
  float csc = 2.3 / (1.0 + d * 0.14);
  vec2 cp = (vWPos.xz + (tFloor ? vec2(0.0) : vec2(vWPos.y * 0.55, -vWPos.y * 0.35))) * csc;
  tcaus = mix(caustic(cp, uTime * 0.85, 1.0 + d * 0.25), 0.3, smoothstep(0.12, 0.5, tpx * csc)) * 1.3 * exp(-d * 0.17) * smoothstep(0.0, 0.06, d);
} else if (!tFloor && tpm.g > 0.03 && vWPos.y > uWaterY) {
  float h = vWPos.y - uWaterY;
  vec2 cp = aN.y > 0.6 ? vWPos.xz : (aN.x > aN.z ? vec2(vWPos.z, vWPos.y) : vec2(vWPos.x, vWPos.y));
  cp = cp * 0.9 + 7.3;
  tcaus = mix(caustic(cp, uTime * 0.7, 2.2), 0.4, smoothstep(0.12, 0.5, tpx * 0.9)) * tpm.g * tpm.g * exp(-h * 0.32) * 0.15;
}
vec3 tWin = windowLight(vWPos, tnW);
totalEmissiveRadiance += diffuseColor.rgb * (tWin + vec3(0.72, 0.96, 1.0) * tcaus * (uCausticK + dot(tWin, vec3(0.35))));
`;
const TILE_POST = /* glsl */`
float tao = 1.0;
if (tFloor && !tPool) tao = mix(0.42, 1.0, smoothstep(0.25, 0.85, tpm.b));
else if (tCeil) tao = mix(0.45, 1.0, smoothstep(0.25, 0.85, tpm.b));
else if (!tPool && !tFloor) tao = mix(0.5, 1.0, smoothstep(0.0, 1.1, hRel));
reflectedLight.directDiffuse *= tao;
reflectedLight.indirectDiffuse *= tao;
reflectedLight.indirectSpecular *= mix(0.45, 1.0, tao);
if (uPlanar > 0.5 && tFloor && vWPos.y > uWaterY) {
  float pw = 1.0 - smoothstep(0.12, 0.5, abs(vWPos.y - uWaterY - 0.15));
  if (pw > 0.001) {
    vec4 rp = uReflMat * vec4(vWPos, 1.0);
    vec3 rc = textureLod(uReflTex, rp.xy / rp.w + tnW.xz * 0.05, clamp(roughnessFactor * 9.0, 0.0, 6.0)).rgb;
    float nv = saturate(dot(normal, normalize(vViewPosition)));
    float fr = 0.04 + 0.96 * pow(1.0 - nv, 5.0);
    reflectedLight.indirectSpecular = mix(reflectedLight.indirectSpecular, rc * mix(0.6, 1.0, tao), pw * fr * (1.0 - roughnessFactor) * tMask);
  }
}
`;

const tileMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.12, metalness: 0 });
tileMat.onBeforeCompile = (sh) => {
  for (const k of ['uTime', 'uWaterY', 'uDeckY', 'uPlanar', 'uCausticK', 'uMask', 'uMaskXf', 'uAtlasOff', 'uReflTex', 'uReflMat',
    'uWinCount', 'uWinO', 'uWinM', 'uWinD', 'uWinCol']) sh.uniforms[k] = U[k];
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nvarying vec3 vWNrm;')
    .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvWNrm = normalize(mat3(modelMatrix) * objectNormal);');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\n' + TILE_PARS)
    .replace('#include <color_fragment>', '#include <color_fragment>\n' + TILE_COLOR)
    .replace('#include <roughnessmap_fragment>', 'float roughnessFactor = tRough;')
    .replace('#include <normal_fragment_maps>', TILE_NORMAL)
    .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n' + TILE_EMIT)
    .replace('#include <aomap_fragment>', '#include <aomap_fragment>\n' + TILE_POST);
};
tileMat.customProgramCacheKey = () => 'pool-tile-v1';

// ---- water: planar reflection + depth-aware refraction with absorption, procedural ripples
const WATER_VS = /* glsl */`
uniform mat4 uReflMat;
varying vec3 vW;
varying vec4 vR;
void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; vR = uReflMat * w; gl_Position = projectionMatrix * viewMatrix * w; }
`;
const WATER_FS = /* glsl */`
#include <packing>
uniform float uTime;
uniform sampler2D uSceneCol;
uniform sampler2D uSceneDepth;
uniform sampler2D uReflTex;
uniform vec2 uRes;
uniform float uNear, uFar;
uniform vec3 uAbsorb, uScatter;
varying vec3 vW;
varying vec4 vR;
${G_HASH}${G_ARCH}${G_WIN}
vec2 wv(vec2 p, vec2 d, float k, float a, float s, float t){ return d * (a * k * cos(dot(d, p) * k + t * s)); }
vec3 waterN(vec2 p, float t){
  vec2 g = wv(p, vec2(0.8, 0.6), 2.1, 0.010, 1.1, t) + wv(p, vec2(-0.6, 0.8), 3.3, 0.006, 1.6, t)
         + wv(p, vec2(0.28, -0.96), 5.7, 0.0035, 2.3, t) + wv(p, vec2(-0.9, -0.43), 9.1, 0.002, 3.1, t);
  g += noised(p * 1.7 + vec2(t * 0.11, t * 0.07)).yz * (1.7 * 0.016);
  g += noised(p * 4.3 - vec2(t * 0.21, -t * 0.17)).yz * (4.3 * 0.0055);
  g += noised(p * 11.0 + vec2(-t * 0.3, t * 0.33)).yz * (11.0 * 0.0014);
  return normalize(vec3(-g.x, 1.0, -g.y));
}
float viewZ(vec2 uv){ return -perspectiveDepthToViewZ(texture2D(uSceneDepth, uv).r, uNear, uFar); }
void main(){
  vec3 toC = cameraPosition - vW;
  float dist = length(toC);
  vec3 V = toC / dist;
  vec3 N = waterN(vW.xz, uTime);
  N = normalize(mix(N, vec3(0.0, 1.0, 0.0), smoothstep(6.0, 40.0, dist) * 0.75));
  vec2 suv = gl_FragCoord.xy / uRes;
  float wz = -(viewMatrix * vec4(vW, 1.0)).z;
  float sz = viewZ(suv);
  float th0 = max(sz - wz, 0.0);
  vec2 ruv = suv + N.xz * clamp(th0, 0.0, 1.5) * 0.9 / max(wz, 0.5);
  float sz2 = viewZ(ruv);
  if (sz2 < wz) { ruv = suv; sz2 = sz; }
  vec3 refr = texture2D(uSceneCol, ruv).rgb;
  float path = max(sz2 - wz, 0.0) * dist / max(wz, 1e-3);
  vec3 T = exp(-uAbsorb * path);
  vec3 wl = windowLight(vW, vec3(0.0, 1.0, 0.0));

// ============================================================ world build
const floorGroups = [], floorData = [], floorDoors = [], callBtns = [];
const interact = [], flickers = [], floaters = [], clocks = [], crts = [], indicators = [], ropes = [];
const AW = GN * 2, atlas = new Uint8Array(AW * AW * 4).fill(255);
const lightPool = Array.from({ length: 10 }, () => { const l = new THREE.PointLight(0xffffff, 0, 16, 2); scene.add(l); return l; });

function buildFloor(fi) {
  const D = FLOORS[fi], B = base(fi), N = GN;
  const group = new THREE.Group(); scene.add(group); floorGroups[fi] = group;
  const room = new Int16Array(N * N).fill(-1), pool = new Int16Array(N * N).fill(-1), step = new Float32Array(N * N).fill(NaN);
  const I = (x) => Math.round((x - PLAN.x0) / CELL), J = (z) => Math.round((z - PLAN.z0) / CELL);
  const each = (r, fn) => { for (let j = J(r[1]); j < J(r[3]); j++) for (let i = I(r[0]); i < I(r[2]); i++) fn(j * N + i); };
  D.rooms.forEach((r, k) => each([r.x0, r.z0, r.x1, r.z1], (c) => { room[c] = k; }));
  (D.holes || []).forEach((r) => each(r, (c) => { room[c] = -1; }));
  D.pools.forEach((p, k) => p.rects.forEach((r) => each(r, (c) => { if (room[c] >= 0) pool[c] = k; })));
  (D.steps || []).forEach((s) => each(s, (c) => { step[c] = s[4]; }));
  const open = (c) => room[c] >= 0 && !D.rooms[room[c]].shaft;
  const top = (c) => !isNaN(step[c]) ? step[c] : pool[c] >= 0 ? D.pools[pool[c]].bottom : 0;
  const geos = [];

  // solid floor columns (deck / pool bottoms / steps) — their side faces become the pool walls
  const fkey = new Array(N * N).fill(null);
  for (let j = 2; j < N - 2; j++) for (let i = 2; i < N - 2; i++) {
    const c = j * N + i; if (!open(c)) continue;
    let type = 'p';
    if (pool[c] < 0 && isNaN(step[c])) {
      type = 'd';
      near: for (let b = -2; b <= 2; b++) for (let a = -2; a <= 2; a++) if (pool[c + b * N + a] >= 0) { type = 'c'; break near; }
    }
    fkey[c] = top(c) + '|' + type;
  }
  for (const r of greedy(fkey, N)) { const [t, type] = r.key.split('|'); tbox(geos, r.x0, B - 5, r.z0, r.x1, B + parseFloat(t), r.z1, type === 'c' ? COPING : WHITE); }

  // walls: every closed cell touching an open cell, as tall as the tallest neighbouring room
  const wkey = new Array(N * N).fill(null);
  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {
    const c = j * N + i; if (room[c] >= 0) continue;
    let h = -1;
    for (let b = -1; b <= 1; b++) for (let a = -1; a <= 1; a++) { const k = room[c + b * N + a]; if (k >= 0) h = Math.max(h, D.rooms[k].h); }
    if (h > 0) wkey[c] = String(h);
  }
  for (const r of greedy(wkey, N)) tbox(geos, r.x0, B - 5, r.z0, r.x1, B + parseFloat(r.key) + 0.3, r.z1);
  D.rooms.forEach((r) => { if (!r.shaft) tbox(geos, r.x0, B + r.h, r.z0, r.x1, B + r.h + 0.3, r.z1); });

  // arched doorways wherever two rooms touch (slab sits in the lower room, flush with the taller room's wall)
  const rs = D.rooms;
  for (let a = 0; a < rs.length; a++) for (let b = a + 1; b < rs.length; b++) {
    const A = rs[a], C = rs[b]; if (A.shaft || C.shaft) continue;
    let line = null;
    if (A.x1 === C.x0 || C.x1 === A.x0) { const lo = Math.max(A.z0, C.z0), hi = Math.min(A.z1, C.z1); if (hi - lo > 0.5) line = { ax: 'x', c: A.x1 === C.x0 ? A.x1 : A.x0, lo, hi }; }
    else if (A.z1 === C.z0 || C.z1 === A.z0) { const lo = Math.max(A.x0, C.x0), hi = Math.min(A.x1, C.x1); if (hi - lo > 0.5) line = { ax: 'z', c: A.z1 === C.z0 ? A.z1 : A.z0, lo, hi }; }
    if (!line) continue;
    const low = A.h <= C.h ? A : C, tall = low === A ? C : A, w = line.hi - line.lo;
    const g = new THREE.ExtrudeGeometry(archShape(w, 2.3, Math.min(w / 2, low.h - 0.15 - 2.3), tall.h + 0.3), { depth: CELL, bevelEnabled: false, curveSegments: 24 });
    if (line.ax === 'z') g.translate(line.lo, B, low.z0 === line.c ? line.c : line.c - CELL);
    else { g.rotateY(-Math.PI / 2); g.translate(low.x0 === line.c ? line.c + CELL : line.c, B, line.lo); }

  const lobby = rs.find((r) => r.lobby);

  tbox(geos, 0.6, B, 1.25, 1, B + lobby.h + 0.3, 1.5);
  tbox(geos, -0.6, B + 2.25, 1.25, 0.6, B + lobby.h + 0.3, 1.5);
  (D.extra || []).forEach((e) => tbox(geos, e[0], B + e[1], e[2], e[3], B + e[4], e[5], NAVY));
  group.add(new THREE.Mesh(mergeGeometries(geos), tileMat));

  // water surfaces
  const wk = new Array(N * N).fill(null);
  for (let c = 0; c < N * N; c++) if (pool[c] >= 0 && room[c] >= 0 && D.pools[pool[c]].water !== null) wk[c] = String(D.pools[pool[c]].water);
  const wg = greedy(wk, N).map((r) => new THREE.PlaneGeometry(r.x1 - r.x0, r.z1 - r.z0).rotateX(-Math.PI / 2).translate((r.x0 + r.x1) / 2, B + parseFloat(r.key), (r.z0 + r.z1) / 2));
  if (wg.length) { const wm = new THREE.Mesh(mergeGeometries(wg), waterMat); wm.layers.set(1); group.add(wm); }

  // plan masks (R water, G water proximity, B open-area AO) into the atlas
  const Rm = new Float32Array(N * N), Om = new Float32Array(N * N);
  for (let c = 0; c < N * N; c++) { Rm[c] = wk[c] !== null ? 1 : 0; Om[c] = open(c) ? 1 : 0; }
  const Gm = blur(blur(Rm, N, 6), N, 6), Bm = blur(blur(Om, N, 3), N, 3);
  const ox = (fi % 2) * N, oy = (fi >> 1) * N;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const p = ((oy + j) * AW + ox + i) * 4, c = j * N + i;
    atlas[p] = Rm[c] * 255; atlas[p + 1] = Math.min(255, Gm[c] * 400); atlas[p + 2] = Bm[c] * 255;
  }

  // walkable ground: painter's list, later entries win
  const walk = [];
  rs.forEach((r) => { if (!r.shaft) walk.push({ x0: r.x0, z0: r.z0, x1: r.x1, z1: r.z1, y: 0 }); });
  D.pools.forEach((p) => p.rects.forEach((r) => walk.push({ x0: r[0], z0: r[1], x1: r[2], z1: r[3], y: p.bottom, block: !p.walk })));
  (D.steps || []).forEach((s) => { if (s[5]) walk.push({ x0: s[0], z0: s[1], x1: s[2], z1: s[3], y: s[4] }); });
  (D.holes || []).forEach((r) => walk.push({ x0: r[0], z0: r[1], x1: r[2], z1: r[3], block: true }));
  walk.push({ x0: -1, z0: 1.25, x1: -0.6, z1: 1.5, block: true }, { x0: 0.6, z0: 1.25, x1: 1, z1: 1.5, block: true });
  const fd = { walk, wins: [] };
  floorData[fi] = fd;

  // windows: frame, glowing glass, beam volume and the light they cast
  const glass = [];
  for (const [ri, side, c, w, sill, h, el, skew] of D.wins) {
    const Rr = rs[ri], ins = V3(...{ n: [0, 0, -1], s: [0, 0, 1], e: [-1, 0, 0], w: [1, 0, 0] }[side]), up = V3(0, 1, 0);
    const along = new THREE.Vector3().crossVectors(up, ins);
    const plane = { n: Rr.z1, s: Rr.z0, e: Rr.x1, w: Rr.x0 }[side];
    const O = (side === 'n' || side === 's' ? V3(c, B + sill, plane) : V3(plane, B + sill, c)).addScaledVector(along, -w / 2);
    const basis = new THREE.Matrix4().makeBasis(along, up, ins).setPosition(O);
    put(fi, M.frame, frameGeo(w, h), basis);
    put(fi, M.frame, new THREE.BoxGeometry(w + 0.36, 0.07, 0.2).translate(w / 2, -0.035, 0.1), basis);
    const gg = new THREE.PlaneGeometry(w, h).translate(w / 2, h / 2, 0.012);
    gg.setAttribute('aAsp', new THREE.BufferAttribute(new Float32Array(gg.attributes.position.count).fill(h / w), 1));
    glass.push(gg.applyMatrix4(basis));
    const er = el * Math.PI / 180;
    const dir = ins.clone().multiplyScalar(Math.cos(er)).add(V3(0, -Math.sin(er), 0)).addScaledVector(along, skew).normalize();
    const Wv = along.clone().multiplyScalar(w), Hv = V3(0, h, 0), Dv = dir.clone().multiplyScalar((sill + h + 5) / -dir.y);
    const Mi = new THREE.Matrix3().set(Wv.x, Hv.x, Dv.x, Wv.y, Hv.y, Dv.y, Wv.z, Hv.z, Dv.z).invert();
    fd.wins.push({ O: new THREE.Vector4(O.x, O.y, O.z, h / w), M: Mi, D: dir });
    const bm = new THREE.Mesh(beamGeo, beamMaterial(Mi, O, h / w, D.beam));
    bm.matrixAutoUpdate = false; bm.matrix.makeBasis(Wv, Hv, Dv).setPosition(O); bm.layers.set(2); group.add(bm);
  }
  if (glass.length) group.add(new THREE.Mesh(mergeGeometries(glass), glassMat));

  // fluorescent ceiling panels (some dead, some flickering)
  const pr = rng(100 + fi);
  rs.forEach((Rr) => {
    if (Rr.shaft) return;
    const w = Rr.x1 - Rr.x0, d = Rr.z1 - Rr.z0, alongX = w >= d, pts = [];
    if (Math.min(w, d) <= 3.01) {

      for (let i = 0; i < n; i++) { const t = (i + 0.5) / n; pts.push(alongX ? [Rr.x0 + t * w, (Rr.z0 + Rr.z1) / 2] : [(Rr.x0 + Rr.x1) / 2, Rr.z0 + t * d]); }
    } else {
      const nx = Math.max(1, Math.round(w / 4.4)), nz = Math.max(1, Math.round(d / 4.4));

    for (const [px, pz] of pts) {
      const m = mtx(px, B + Rr.h, pz, alongX ? 0 : Math.PI / 2);
      put(fi, M.panelFrame, new THREE.BoxGeometry(1.32, 0.05, 0.68).translate(0, -0.025, 0), m);
      const q = pr(), pg = new THREE.BoxGeometry(1.2, 0.02, 0.58).translate(0, -0.06, 0);

  landing(fi);
  PROPS[fi](fi);
}

// ============================================================ props
const blockRot = (fi, x, z, ry, hx, hz) => {
  const c = Math.abs(Math.cos(ry)), s = Math.abs(Math.sin(ry)), ex = hx * c + hz * s, ez = hx * s + hz * c;

};
function bench(fi, x, z, ry, len = 2.2, towel = false) {

}

}

const buoyWall = (fi, x, y, z, ry) => put(fi, M.buoy, new THREE.TorusGeometry(0.3, 0.075, 12, 32), mtx(x, base(fi) + y, z, ry));

const decalMats = {};

function flamingo(fi, x, z, waterY) {

const elev = { y: base(1), cur: 1, target: 1, door: 0, phase: 'idle', t: 0, y0: 0, y1: 0, dur: 1, hold: 0, shown: '' };

  const speed = (keys.ShiftLeft || keys.ShiftRight ? 2.5 : 1.5) * (wet ? 0.7 : 1);
  if (l > 0) { tx = tx / l * speed; tz = tz / l * speed; }
  const k = 1 - Math.exp(-dt * 4.5);                       // heavy, slow-to-respond walk
  player.vx += (tx - player.vx) * k; player.vz += (tz - player.vz) * k;
  const nx = player.x + player.vx * dt, nz = player.z + player.vz * dt;
  if (canStand(nx, player.z, player.gy)) player.x = nx; else player.vx *= 0.3;
  if (canStand(player.x, nz, player.gy)) player.z = nz; else player.vz *= 0.3;
  player.inCab = player.x > -0.97 && player.x < 0.97 && player.z < 1.18 && player.z > -0.72;
  const g = groundAt(player.x, player.z);
  if (player.inCab) player.gy = elev.y - base(player.floor);
  else if (g !== null) player.gy += (g - player.gy) * Math.min(1, dt * 10);
  const sp = Math.hypot(player.vx, player.vz);
  player.amp += (Math.min(sp / 1.5, 1.3) - player.amp) * Math.min(1, dt * 4);
  player.bob += dt * sp * 3.5;
}
function updateCamera() {
  const a = player.amp, bobY = Math.abs(Math.sin(player.bob)) * 0.05 * a - 0.025 * a, sway = Math.cos(player.bob) * 0.022 * a;
  const shake = elev.phase === 'moving' && player.inCab ? Math.sin(U.uTime.value * 47) * 0.0025 : 0;
  camera.position.set(player.x + Math.cos(player.yaw) * sway, base(player.floor) + player.gy + EYE + bobY + shake, player.z - Math.sin(player.yaw) * sway);
  camera.rotation.set(player.pitch, player.yaw, Math.cos(player.bob) * 0.006 * a);
  camera.updateMatrixWorld();
}

function setFloor(fi) {
  player.floor = fi;
  floorGroups.forEach((g, i) => { g.visible = i === fi; });
  const F = FLOORS[fi], fd = floorData[fi], B = base(fi);
  lightPool.forEach((L, i) => {
    const d = F.lights[i];
    if (d) { L.position.set(d[0], B + d[1], d[2]); L.intensity = d[3]; L.color.setHex(d[4]); L.userData = { base: d[3], flick: !!d[5], seed: i * 7.3 + fi }; }
    else { L.intensity = 0; L.position.set(0, -500, 0); L.userData = { base: 0, flick: false, seed: 0 }; }
  });
  U.uWaterY.value = B + F.waterY; U.uDeckY.value = B; U.uCausticK.value = F.caus;
  U.uAtlasOff.value.set((fi % 2) * 0.5, (fi >> 1) * 0.5);
  U.uWinCount.value = fd.wins.length;
  fd.wins.forEach((w, i) => { U.uWinO.value[i].copy(w.O); U.uWinM.value[i].copy(w.M); U.uWinD.value[i].copy(w.D); });
  scene.fog.density = F.fog;
}

// ============================================================ render pipeline
const _n = V3(0, 1, 0), _p = V3(), _cp = V3(), _v = V3(), _t = V3(), _la = V3(), _rm = new THREE.Matrix4(), _pl = new THREE.Plane(), _cl = new THREE.Vector4(), _q = new THREE.Vector4();
function updateMirror() {
  // mirror the camera in the current floor's water plane (oblique near plane clips everything below it)
  _cp.setFromMatrixPosition(camera.matrixWorld);
  _p.set(_cp.x, U.uWaterY.value, _cp.z);
  _rm.extractRotation(camera.matrixWorld);
  _v.subVectors(_p, _cp).reflect(_n).negate().add(_p);
  _la.set(0, 0, -1).applyMatrix4(_rm).add(_cp);
  _t.subVectors(_p, _la).reflect(_n).negate().add(_p);
  mirrorCam.position.copy(_v);
  mirrorCam.up.set(0, 1, 0).applyMatrix4(_rm).reflect(_n);
  mirrorCam.lookAt(_t);
  mirrorCam.near = camera.near; mirrorCam.far = camera.far;
  mirrorCam.updateMatrixWorld();
  mirrorCam.projectionMatrix.copy(camera.projectionMatrix);
  U.uReflMat.value.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1).multiply(mirrorCam.projectionMatrix).multiply(mirrorCam.matrixWorldInverse);
  _pl.setFromNormalAndCoplanarPoint(_n, _p).applyMatrix4(mirrorCam.matrixWorldInverse);
  _cl.set(_pl.normal.x, _pl.normal.y, _pl.normal.z, _pl.constant);
  const e = mirrorCam.projectionMatrix.elements;
  _q.set((Math.sign(_cl.x) + e[8]) / e[0], (Math.sign(_cl.y) + e[9]) / e[5], -1, (1 + e[10]) / e[14]);
  _cl.multiplyScalar(2 / _cl.dot(_q));
  e[2] = _cl.x; e[6] = _cl.y; e[10] = _cl.z + 1 - 0.003; e[14] = _cl.w;
  mirrorCam.projectionMatrixInverse.copy(mirrorCam.projectionMatrix).invert();
}
class PoolPass extends Pass {
  constructor() {
    super();
    this.needsSwap = false;
    this.rtScene = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthTexture: new THREE.DepthTexture(1, 1, THREE.FloatType) });
    this.rtRefl = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
    this.copy = new FullScreenQuad(new THREE.ShaderMaterial({
      uniforms: { tC: { value: this.rtScene.texture }, tD: { value: this.rtScene.depthTexture } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: 'uniform sampler2D tC; uniform sampler2D tD; varying vec2 vUv; void main(){ gl_FragColor = texture2D(tC, vUv); gl_FragDepth = texture2D(tD, vUv).r; }',
      depthTest: true, depthWrite: true, depthFunc: THREE.AlwaysDepth,
    }));
    U.uSceneCol.value = this.rtScene.texture; U.uSceneDepth.value = this.rtScene.depthTexture; U.uReflTex.value = this.rtRefl.texture;
  }
  setSize(w, h) {
    w = Math.max(1, Math.floor(w)); h = Math.max(1, Math.floor(h));
    this.rtScene.setSize(w, h); this.rtRefl.setSize(Math.max(1, w >> 1), Math.max(1, h >> 1)); U.uRes.value.set(w, h);
  }
  render(renderer, writeBuffer, readBuffer) {
    const auto = renderer.autoClear;
    renderer.autoClear = true;
    updateMirror();                                   // 1) reflection of the opaque world
    U.uReflTex.value = DUMMY; U.uPlanar.value = 0;
    renderer.setRenderTarget(this.rtRefl); renderer.render(scene, mirrorCam);
    U.uReflTex.value = this.rtRefl.texture; U.uPlanar.value = 1;
    camera.layers.set(0);                             // 2) opaque world with depth
    renderer.setRenderTarget(this.rtScene); renderer.render(scene, camera);
    renderer.setRenderTarget(this.renderToScreen ? null : readBuffer);
    this.copy.render(renderer);                       // 3) copy colour+depth, then water + light shafts on top
    camera.layers.set(1); camera.layers.enable(2);
    renderer.autoClear = false;
    renderer.render(scene, camera);
    camera.layers.set(0);
    renderer.autoClear = auto;
  }
}
const composer = new EffectComposer(renderer);
const poolPass = new PoolPass();
composer.addPass(poolPass);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.55, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const fxaa = new ShaderPass(FXAAShader);
composer.addPass(fxaa);
const finalPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float v = smoothstep(0.9, 0.25, length((vUv - 0.5) * vec2(1.0, 0.85)));
      c *= mix(0.5, 1.0, v);
      c += (h(vUv * 917.0 + fract(uTime) * 61.0) - 0.5) * 0.022;
      gl_FragColor = vec4(c, 1.0);
    }`,
});
composer.addPass(finalPass);

let quality = 1;
function resize() {
  const pr = Math.min(devicePixelRatio || 1, 1.5) * quality;
  renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  fxaa.material.uniforms.resolution.value.set(1 / (innerWidth * pr), 1 / (innerHeight * pr));
}
addEventListener('resize', resize);

function makeEnv() {
  const s = new THREE.Scene();
  const box = new THREE.Mesh(new THREE.BoxGeometry(24, 9, 24), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.016, 0.032, 0.034), side: THREE.BackSide }));
  box.position.y = 2.5; s.add(box);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), new THREE.MeshBasicMaterial({ color: new THREE.Color(0.02, 0.07, 0.075) }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -1.9; s.add(floor);
  const pm = new THREE.MeshBasicMaterial({ color: new THREE.Color(5, 5.4, 5.8) });
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) { const p = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.7), pm); p.rotation.x = Math.PI / 2; p.position.set(i * 5, 6.9, j * 5); s.add(p); }
  const pmrem = new THREE.PMREMGenerator(renderer);
  const tex = pmrem.fromScene(s, 0.03).texture;
  pmrem.dispose();
  return tex;
}

// ============================================================ interaction / input
const raycaster = new THREE.Raycaster(), CENTER = new THREE.Vector2();
let aimed = null, active = false, locked = false, everLocked = false, dragLook = false, dragging = false;
function updateAim() {
  const list = interact.filter((it) => (it.fi === player.floor || it.fi === -1) && (!it.ok || it.ok()));
  raycaster.setFromCamera(CENTER, camera); raycaster.far = 2.6;
  const hit = raycaster.intersectObjects(list.map((it) => it.obj), false)[0];
  aimed = hit ? list.find((it) => it.obj === hit.object) : null;
  const txt = active && aimed ? aimed.label() : '';
  if ($('hint').textContent !== txt) $('hint').textContent = txt;
}
const doInteract = () => { if (aimed) aimed.act(); };
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyE' && active && !e.repeat) doInteract();
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
addEventListener('mousemove', (e) => {
  if (!active || !(locked || (dragLook && dragging))) return;
  player.yaw -= e.movementX * 0.0021;
  player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch - e.movementY * 0.0021));
});
renderer.domElement.addEventListener('mousedown', (e) => { if (e.button !== 0) return; if (locked) doInteract(); else if (dragLook) { dragging = true; doInteract(); } });
addEventListener('mouseup', () => { dragging = false; });
function showOverlay(on, msg) {
  $('overlay').style.display = on ? 'flex' : 'none';
  $('cross').style.display = on ? 'none' : 'block';
  if (msg) $('go').textContent = msg;
}
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  if (locked) { active = true; everLocked = true; showOverlay(false); }
  else if (!dragLook) { active = false; showOverlay(true, '클릭하여 계속'); }
});
document.addEventListener('pointerlockerror', () => {
  if (everLocked) { showOverlay(true, '잠시 후 다시 클릭'); return; }
  dragLook = true; active = true; showOverlay(false); $('hint').textContent = '포인터 잠금 불가 — 드래그로 시점 조작';
});
$('overlay').addEventListener('click', () => {
  if (!window.__ready) return;
  try { const p = renderer.domElement.requestPointerLock(); if (p && p.catch) p.catch(() => document.dispatchEvent(new Event('pointerlockerror'))); }
  catch { document.dispatchEvent(new Event('pointerlockerror')); }
});

// ============================================================ per-frame world animation
function flick(t, s) {
  const a = Math.sin(t * 0.9 + s * 12.9898) + Math.sin(t * 2.3 + s * 78.233) * 0.6;
  if (a > 1.2) return Math.random() < 0.5 ? 0.04 : 1;
  if (a > 1.05) return 0.55 + Math.random() * 0.45;
  return 1;
}
function animateWorld(dt) {
  const t = U.uTime.value;
  for (const f of flickers) f.mat.color.copy(f.base).multiplyScalar(flick(t, f.seed));
  for (const L of lightPool) if (L.userData.flick) L.intensity = L.userData.base * flick(t, L.userData.seed);
  for (const f of floaters) {
    f.obj.position.y = f.y + Math.sin(t * 0.9 + f.seed) * 0.022;
    f.obj.rotation.x = Math.sin(t * 0.7 + f.seed) * 0.03; f.obj.rotation.z = Math.cos(t * 0.6 + f.seed) * 0.03;
    if (f.drift) { const a = t * 0.035 + f.seed; f.obj.position.x = f.x + Math.cos(a) * f.drift; f.obj.position.z = f.z + Math.sin(a) * f.drift; f.obj.rotation.y = -a * 0.6 + f.seed; }
  }
  for (const r of ropes) r.position.y = Math.sin(t * 0.8) * 0.01;
  const d = new Date(), real = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
  for (const c of clocks) {
    const secs = c.mode === 'real' ? real : c.mode === 'stuck' ? 3 * 3600 + 33 * 60 + (Math.sin(t * 5) > 0.6 ? 1 : 0) : 43200 - real % 43200;
    c.s.rotation.z = -(secs % 60) / 60 * Math.PI * 2;
    c.m.rotation.z = -((secs / 60) % 60) / 60 * Math.PI * 2;
    c.h.rotation.z = -((secs / 3600) % 12) / 12 * Math.PI * 2;
  }
  for (const c of crts) crtUpdate(c, dt);
}
function simulate(dt) {
  U.uTime.value += dt;
  updatePlayer(dt, active);
  elevUpdate(dt);
  animateWorld(dt);
}

// ============================================================ boot
await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 30)));
try {
  buildCab();
  for (let i = 0; i < FLOORS.length; i++) buildFloor(i);
  flushBatches();
  const maskTex = new THREE.DataTexture(atlas, AW, AW);
  maskTex.minFilter = maskTex.magFilter = THREE.LinearFilter; maskTex.needsUpdate = true;
  U.uMask.value = maskTex;
  scene.environment = makeEnv();
  resize();
  setFloor(1);

  // self-checks: every floor's lobby and the spawn point must be standable
  for (let i = 0; i < FLOORS.length; i++) { player.floor = i; console.assert(canStand(0, 3.2, 0), `floor ${LABELS[i]} lobby not walkable`); }
  player.floor = 1;
  console.assert(canStand(player.x, player.z, 0), 'spawn blocked');
  console.assert(floorData.every((f) => f.wins.length <= MAX_WIN), 'too many windows');

  floorGroups.forEach((g) => { g.visible = true; });
  camera.layers.enableAll(); updateCamera(); renderer.compile(scene, camera); camera.layers.set(0);
  setFloor(1);
} catch (err) {
  $('err').textContent = '초기화 실패: ' + (err && err.message || err);
  throw err;
}
window.__ready = true;
showOverlay(true, '클릭하여 입장');

let last = performance.now(), perfAcc = 0, perfN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000, dt = Math.min(0.05, raw); last = now;
  simulate(dt);
  updateCamera();
  camera.getWorldDirection(U.uCamFwd.value);
  finalPass.uniforms.uTime.value = U.uTime.value;
  updateAim();
  composer.render(dt);
  if (active) {                                   // crude dynamic resolution to keep the multi-pass renderer smooth
    perfAcc += raw; perfN++;
    if (perfN >= 90) {
      const avg = perfAcc / perfN * 1000; perfAcc = 0; perfN = 0;
      if (avg > 26 && quality > 0.55) { quality = Math.max(0.55, quality - 0.1); resize(); }
      else if (avg < 15 && quality < 1) { quality = Math.min(1, quality + 0.05); resize(); }
    }
  }
}
requestAnimationFrame(frame);

// small handle for automated checks / debugging from the console
window.__pr = { player, elev, crts, setFloor, elevRequest, simulate, interact: doInteract, U, scene, floorGroups, camera,
  tp(fi, x, z, yaw = player.yaw, pitch = 0) { setFloor(fi); Object.assign(player, { x, z, yaw, pitch, gy: groundAt(x, z) ?? 0, vx: 0, vz: 0 }); },
  aimed: () => aimed && aimed.label(), setActive: (v) => { active = v; }, keys, groundAt };
</script>
