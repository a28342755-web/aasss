:root{
  --ink:#0c1020; --panel:#141a30; --panel-2:#1c2442; --line:#34407a;

}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--font-ui);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#app{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;box-shadow:0 0 0 1px var(--line)}
#cv{display:block;width:100%;height:100%}
#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,8,18,.6);padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));z-index:5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;max-width:620px;width:100%;max-height:100%;overflow:auto;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
.card h2{font-family:var(--font-display);font-size:26px;font-weight:700;margin:2px 0 4px;color:var(--gold);text-wrap:balance}
.card h3{font-family:var(--font-display);font-size:17px;margin:16px 0 6px;color:var(--text)}
.card p{line-height:1.65;margin:6px 0}
.card ul{margin:4px 0;padding-left:18px;line-height:1.6;font-size:13px}
.sub{color:var(--dim);font-size:13px}
.note{border-left:3px solid var(--gold);padding:6px 10px;background:var(--panel-2);font-size:13px;margin:8px 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:inherit;font-size:14px;color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.pri{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:600}
button.sm{padding:2px 9px;font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 14px;font-size:13px}
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.job{border:1px solid var(--line);border-radius:4px;padding:10px;background:var(--panel-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.job b{font-family:var(--font-display);font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid rgba(52,64,122,.45);font-variant-numeric:tabular-nums;font-size:13px}
.row>span:first-child{min-width:0}
.row .r{display:flex;align-items:center;gap:8px}
.bar{height:6px;width:110px;background:#0a0e1c;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
kbd{font-family:var(--font-ui);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;background:var(--panel-2)}
.warn{color:var(--danger)!important}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--dim)}
#touch{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));pointer-events:none;z-index:4}
#touch .pad{display:grid;gap:6px;pointer-events:auto}
#touch button{width:52px;height:52px;border-radius:50%;background:rgba(20,26,48,.72);font-size:13px;padding:0;touch-action:none}
#touch button.on{border-color:var(--gold)}

function derive(){

    atkMelee:10+12*E('STR')+4*E('DEX'),atkRanged:8+10*E('DEX')+5*E('SEN'),atkMagic:8+13*E('INT')+3*E('WIL'),
    def:(10*E('VIT')+8*E('WIL')+2*P.prof.guard)*M.def*(1+b.def),crit:Math.min(.75,.03+.015*E('LUK')+M.crit+b.crit),
    eva:Math.min(.4,.02+.012*E('AGI')+M.eva),spd:(210+12*E('AGI')+.6*P.prof.agile)*M.spd*(1+b.spd),aspd:1/(1+.04*E('DEX')),

function hitMob(m,o){
  const D=MOBS[m.type];if(m.dead)return;
  const crit=o.forceCrit||P.hidden>0||Math.random()<P.d.crit;
  let dmg=dmgFormula(atkOf(o.base)*(o.summon?.6*M.summon:1),o.pow||1,D.def);
  if(crit)dmg*=1.5;if(m.mark)dmg*=1+m.mark.amt;if(o.holy&&D.dark)dmg*=2;
  if(P.nextHitT>0&&!o.summon){dmg*=P.nextHit;P.nextHitT=0;}
  dmg=Math.max(1,Math.round(dmg*rand(.92,1.08)));
  if(!o.summon)P.hidden=0;
  m.hp-=dmg;m.flash=.12;m.aggro=true;if(m.state==='patrol')m.state='chase';
  const dir=Math.sign(m.x-P.x)||P.face;
  if(!D.boss){if(o.knock)m.vx=dir*o.knock;if(o.stun){m.stun=Math.max(m.stun,o.stun);m.state='chase';}if(o.launch){m.vy=-o.launch;m.stun=Math.max(m.stun,.6);m.state='chase';}}
  else if(o.stun)m.stun=Math.max(m.stun,o.stun*.3);
  if(o.summon)train('magic',.04);else{train(PROF_OF[o.base||'melee'],.25);if(!P.onGround)train('agile',.3);}
  text(m.x+rand(-8,8),m.y-D.h-10,dmg,crit?'#ffd36b':'#ffffff',crit);burst(m.x,m.y-D.h/2,crit?'#ffd36b':'#ffffff',crit?10:5);
  if(m.hp<=0)killMob(m);
}
function killMob(m){
  const D=MOBS[m.type];m.dead=true;m.resp=D.resp;m.mark=null;burst(m.x,m.y-D.h/2,'#f0e0c0',22,220);
  gainExp(D.exp);const or=randi(D.or[0],D.or[1]);if(or){P.or+=or;text(m.x,m.y-D.h-30,`+${or} Or`,'#e8b85e');}
  msg(`${D.name} 처치 · EXP +${D.exp}${or?` · +${or} Or`:''}`);
  if(m.type==='boar'&&P.quest.boar>=0&&P.quest.boar<8){P.quest.boar++;if(P.quest.boar===8)msg('의뢰 목표 달성 — 촌장 베르트에게 보고하세요','#e8b85e');}
  if(m.night){m.gone=true;if(isNight())addRep(100,'야간 습격 저지 (치안 방위)');}
  if(D.boss){msg('실바니아 고대 성소의 위협을 물리쳤습니다!','#e8b85e');addRep(300,'성소 정화');}
  save();
}
function hurtPlayer(o){
  if(P.dead||P.inv>0)return;
  if(P.parry>0){P.parry=0;P.inv=.35;text(P.x,P.y-64,'흘려보내기!','#c9ccd6',true);train('sword',.5);
    if(o.mob)hitMob(o.mob,{pow:P.parryPow,base:'melee',stun:.6});if(M.parryHeal)heal(M.parryHeal,true);return;}
  if(Math.random()<P.d.eva){P.inv=.25;text(P.x,P.y-60,'회피','#b8e0ff');train('agile',.5);return;}
  const front=(o.x-P.x)*P.face>=0;let mul=1;
  if((P.guarding||(P.dash&&P.dash.guard))&&front){
    if(P.guardT<.2){P.inv=.25;text(P.x,P.y-64,'저스트 가드!','#ffd36b',true);train('guard',.6);burst(P.x+P.face*14,P.y-28,'#ffe9a8',12);
      if(o.mob&&!MOBS[o.mob.type].boss){o.mob.stun=.9;o.mob.state='chase';}return;}
    mul=M.guardTaken;train('guard',.25);
  }else train('guard',.08);
  let dmg=Math.max(1,Math.round(dmgFormula(o.atk,o.pow||1,P.d.def)*mul*rand(.92,1.08)));
  if(P.shield>0){const ab=Math.min(P.shield,dmg);P.shield-=ab;dmg-=ab;if(ab)text(P.x+14,P.y-58,`흡수 ${ab}`,'#9fc4ff');}
  P.hp-=dmg;if(dmg)text(P.x,P.y-56,dmg,mul<1?'#c0c8e0':'#ff7a68',mul===1);
  if(!P.B.sa&&mul===1){P.kbx=Math.sign(P.x-o.x||1)*260;if(P.onGround){P.vy=-200;P.onGround=false;}if(o.stun)P.stun=o.stun;shake=.15;}
  if(o.slow&&!P.B.sa)P.slow=o.slow;
  P.inv=.6;if(P.hp<=0)die();
}
function heal(f,silent,flat){let a=P.d.maxHp*f*M.heal+(flat||0);if(P.hp<P.d.maxHp*.3)a*=1+M.mercy;a=Math.round(a);P.hp=Math.min(P.d.maxHp,P.hp+a);if(!silent)text(P.x,P.y-60,`+${a}`,'#93c66b');burst(P.x,P.y-30,'#c8f0a0',10,90);}
function die(){
  P.dead=true;P.hp=0;P.summon=null;burst(P.x,P.y-24,'#ff7a68',30,240);

function meleeHit(o){

    pow:o.pow||1,base:o.base||'ranged',pierce:o.pierce,holy:o.holy,r:o.r||5,kind:o.kind||(o.holy?'holy':o.base==='magic'?'orb':'arrow')});

  steal:()=>{let note;if(Math.random()<stealChance()){P.potions++;note='들키지 않고 포션 하나를 챙겼다…';}else{P.wanted=true;addRep(-2000,'도둑질 목격 — 현상수배');note='<span class="warn">메이가 소리친다! 도둑질이 목격되어 현상수배되었다 (평판 −2,000).</span>';}save();showDialog('mei',note);},
  rest:()=>{const p=price(3);let note='';if(p!==null&&P.or>=p){P.or-=p;P.hp=P.d.maxHp;P.mp=P.d.maxMp;note='푹 쉬었다. 체력과 마나가 모두 회복되었다.';save();}showDialog('luna',note);},
  qaccept:()=>{P.quest.boar=0;save();showDialog('bert','의뢰 수락: 아그로스 평초원의 와일드 보어 8마리');},
  qdone:()=>{P.quest.boar=-1;P.or+=5;addRep(200,'농경지 보호 의뢰 완수');save();showDialog('bert','보상: 5 Or · 평판 +200');},
  report:()=>{P.secret=2;addRep(500,'숨겨진 유적 좌표 제공');save();showDialog('bert','"지도에도 없던 곳이라니! 학자들이 기뻐하겠군." 평판 +500');},
  fine:()=>{if(P.or>=500){P.or-=500;P.wanted=false;save();}showDialog('bert',P.wanted?'':'벌금 납부 — 현상수배 해제');},
  lore:()=>showDialog('bert','"태초에 네 창조주가 세상을 빚었네. 지상의 에르데온, 지하의 카타브라, 하늘의 아에리온, 바다의 탈라시아. 문명의 탐욕이 대붕괴를 부른 뒤로 세계는 끊겼고, 지금 그 틈새로 절대공허 아페이론이 깨어나고 있다는 소문이 돌지."'),
};
panel.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(b&&!b.disabled)ACT[b.dataset.act]?.(b.dataset.arg);});

// ───────────────────────── boot ─────────────────────────
ZONES.forEach(z=>{z.sky0=z.sky[0];z.sky1=z.sky[1];});
resetWorld();spawnPlayer();
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(!paused)update(dt);hit.clear();render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
showIntro();
</script>
