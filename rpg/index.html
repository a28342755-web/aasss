<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- HEAD:START -->
<title>삼천의 운명</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="3,000개의 직업 중 하나가 무작위로 정해지는 턴제 도트 RPG">
<!-- HEAD:END -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- BODY:START -->
<div id="game">
  <div id="screen">
    <canvas id="cv" aria-label="게임 화면"></canvas>
    <div id="hud"></div>
    <div id="ui"></div>
    <div id="fade"></div>
  </div>
  <div id="pad" hidden>
    <div class="dpad">
      <button type="button" class="pk up" data-k="up" aria-label="위">▲</button>
      <button type="button" class="pk left" data-k="left" aria-label="왼쪽">◀</button>
      <button type="button" class="pk right" data-k="right" aria-label="오른쪽">▶</button>
      <button type="button" class="pk down" data-k="down" aria-label="아래">▼</button>
    </div>
    <div class="actpad">
      <button type="button" class="pk bbtn" data-k="b" aria-label="취소">B</button>
      <button type="button" class="pk abtn" data-k="a" aria-label="결정">A</button>
    </div>
  </div>
  <p id="keys-hint">방향키 고르기 · Z·Enter·Space 결정 · X·Esc 취소</p>
</div>
<!-- BODY:END -->
<!-- SCRIPTS:START -->
<script src="js/data-jobs.js"></script>
<script src="js/data-world.js"></script>
<script src="js/jobs.js"></script>
<script src="js/engine.js"></script>
<script src="js/sprites.js"></script>
<script src="js/doll.js"></script>
<script src="js/world.js"></script>
<script src="js/effects.js"></script>
<script src="js/spells.js"></script>
<script src="js/data-heroes.js"></script>
<script src="js/heroes.js"></script>
<script src="js/heroart.js"></script>
<script src="js/game.js"></script>
<!-- SCRIPTS:END -->
</body>
</html>
